# The deploy host's compose file — /opt/services/runway/docker-compose.yml on ar00.
#
# This is the file that actually runs production. The docker-compose.yml at the repository
# root is a DEVELOPMENT artefact: it declares `build:` with no `image:`, uses host
# networking, and publishes ports. Reading it to learn how production is wired gives the
# wrong answer on every one of those points.
#
# Kept here so the topology is reviewable and diffable. It contains no secrets — JWT_SECRET
# is a ${...} reference resolved from a .env beside it on the host, which is not and must
# never be in this repository (RULE-HYG-001).
#
# It is NOT deployed from here. Changes must be applied to the host by hand and this file
# updated in the same change; nothing detects drift between the two (RISK-OPS-002).
services:
  backend:
    # Parameterised so the documented rollback works. Unset resolves to :latest, which is
    # what the deploy job pulls; `export RUNWAY_SHA=<sha>` pins an immutable tag instead.
    # Before this, the runbook's RUNWAY_SHA had nothing to substitute into and a rollback
    # would have re-pulled the broken build it was escaping.
    image: ghcr.io/ulrichschinz/runway-backend:${RUNWAY_SHA:-latest}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./users.db:/app/users.db
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATA_ROOT=/app/data
      - DB_PATH=/app/users.db
    networks:
      - traefik-public
    # A container that crash-loops on startup is otherwise indistinguishable from a healthy
    # one: `docker compose up -d` returns success either way. On 2026-08-04 that gap kept a
    # dead backend in production through two green deploys (ADR 0004). Python rather than
    # curl because the runtime image ships no HTTP client. Verified against the running
    # container before this was applied.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/ulrichschinz/runway-frontend:${RUNWAY_SHA:-latest}
    restart: unless-stopped
    environment:
      - BACKEND_HOST=backend
    depends_on:
      backend:
        # `depends_on: [backend]` waits for started, not healthy — which is what this file
        # had, and it means the frontend can come up in front of a dead backend.
        condition: service_healthy
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.runway.rule=Host(`runway.agentic-reach.com`)"
      - "traefik.http.routers.runway.entrypoints=websecure"
      - "traefik.http.routers.runway.tls.certresolver=letsencrypt"
      - "traefik.http.services.runway.loadbalancer.server.port=4000"

networks:
  traefik-public:
    external: true
