# The deploy host's compose file — /opt/services/runway/docker-compose.yml on ar00.
#
# This is the file that actually runs production. The docker-compose.yml at the repository
# root is a DEVELOPMENT artefact: it declares `build:` with no `image:`, uses host
# networking, and publishes ports. Reading it to learn how production is wired gives the
# wrong answer on every one of those points.
#
# Kept here so the topology is reviewable and diffable. It contains no secrets — JWT_SECRET
# is a ${...} reference resolved from a .env beside it on the host, which is not and must
# never be in this repository (RULE-HYG-001).
#
# THIS FILE IS DEPLOYED. backend/Dockerfile bakes it into the backend image at
# /opt/stack/docker-compose.yml, and the host's shared deploy script extracts it from the
# image and writes it over the on-disk compose before pulling — see
# [the deploy mechanism](../../docs/operations.md#the-deploy-mechanism). It is no longer a
# transcription of the host's file; it is the host's file. Edit it through a pull request like
# code, never by hand on the server.
#
# It said something different, and wrong, between 2026-08-28 and 2026-08-31: that a
# runway-specific forced command fetched this file from raw.githubusercontent at the deployed
# commit. That script was written but never installed, and the mechanism it described never
# existed on the host. See ADR 0032.
#
# RULE-OPS-003 fails the gate if anything here asks the host for privilege, its network
# namespace, or a bind mount outside the service directory. RULE-HYG-003 fails if a literal
# secret ever replaces a ${...} reference. RULE-OPS-004 fails it if a service stops giving up
# what it gives up below: a writable root, new privileges, its capabilities, or root itself.
#
# ROLLING BACK ACROSS 2026-11-24 (brief 0076): pinning RUNWAY_SHA is enough while the frontend
# block below keeps the previous deploy's shape (SHIM-OPS-002). Once the frontend switch change
# has made it read-only, roll back no further than brief 0076's commit without restoring that
# commit's compose too: an older frontend image writes its config into /etc/nginx and cannot
# start read-only. docs/operations.md#rolling-back.
services:
  backend:
    # Parameterised so the documented rollback works. Unset resolves to :latest, which is
    # what the deploy job pulls; `export RUNWAY_SHA=<sha>` pins an immutable tag instead.
    # Before this, the runbook's RUNWAY_SHA had nothing to substitute into and a rollback
    # would have re-pulled the broken build it was escaping.
    image: ghcr.io/ulrichschinz/runway-backend:${RUNWAY_SHA:-latest}
    restart: unless-stopped
    # Container hardening (finding SEC-003, ADR 0048, docs/operations.md#container-hardening).
    #
    # The image carries the unprivileged uid 10001 (and still defaults to uid 0 until the contract
    # step, so it also runs under the previous compose). This line keeps the backend at uid 0
    # until the operator has handed the host's data to uid 10001 with
    # /opt/runway/volume_ownership.py and then sets RUNWAY_BACKEND_USER=10001:10001 in the .env
    # beside this file. Unset, nothing changes for the data on the deploy that ships this.
    # SHIM-OPS-001 dates the step that removes the fallback.
    user: "${RUNWAY_BACKEND_USER:-0:0}"
    # Nothing in the image is writable: not the code, not /etc. The process writes three places
    # only — the two bind mounts below and a capped /tmp, which neither executes nor honours
    # setuid. SQLite's temp files and Taskwarrior's land there.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    # Every default capability but DAC_OVERRIDE, while the backend may still be uid 0: a root
    # process without it could not write a host file root does not own, and nobody has read who
    # owns them. A uid-10001 process holds no effective capability either way. The contract step
    # makes this `cap_drop: [ALL]`; RULE-OPS-004 accepts exactly this list until then.
    cap_drop:
      - AUDIT_WRITE
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    volumes:
      - ./data:/app/data
      # users.db's rollback journal is created beside the database, so the database needs a
      # directory the process can write. ./db is that directory, and the host's EXISTING
      # ./users.db is mounted into it — the same file, not a copy, so no data moves and the
      # previous compose, which mounts ./users.db at /app/users.db, still opens exactly this
      # database. Docker creates ./db on the first start; the second mount covers the empty
      # placeholder file it leaves there. The journal now outlives the container, where it used
      # to sit in the image's layer and vanish with it.
      - ./db:/app/db
      - ./users.db:/app/db/users.db
      # This file itself, read-only, so the server can report the SHA-256 of the compose the host
      # applied and verify-deploy can compare it with this commit's (brief 0073, RISK-OPS-002). A
      # hash is all that leaves the container — GET /skill never serves the file. Relative to the
      # service directory like the two mounts above (RULE-OPS-003).
      - ./docker-compose.yml:/etc/runway/applied-compose.yml:ro
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATA_ROOT=/app/data
      - DB_PATH=/app/db/users.db
      # The zone the day logic runs in. Not application configuration — no Settings field
      # reads it, so it is not an env var in README's sense (RULE-SURF-002); libc reads it,
      # and both the backend and the `task` it spawns follow.
      #
      # "Today", overdue, due today and a tickler task returning are all "which calendar day
      # does this stored UTC timestamp fall on", and Taskwarrior reads a bare YYYY-MM-DD in
      # the same zone. On UTC, between local midnight and 02:00 the server's day is still
      # yesterday's: a task entered as due today reads back as due yesterday and is reported
      # overdue. The users are in Berlin; the server now is too.
      #
      # Everything else stamped here asks for UTC by name — the JSON log lines, the audit
      # log and the JWT expiry — and the container tier pins that this stays true.
      #
      # Deleting this line moves the deployed day logic back to UTC. Every zone test sets
      # TZ for itself, so one of them reads this file instead: TestTheServersZone in
      # backend/tests/unit/test_task_service.py goes red if this line disappears.
      - TZ=Europe/Berlin
      # Unset resolves to INFO, which is what the application defaults to anyway — so this
      # line changes nothing until someone raises it to debug a live problem. It is here so
      # the knob is visible where the deployment is described rather than only in README.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # SEC-001, ADR 0043: compat serves accounts not yet migrated from data/<username>/;
      # strict refuses them. The list above is explicit and there is no env_file, so without
      # this line setting it in the host .env would not reach the container at all.
      # backend/tests/unit/test_task_storage.py pins it.
      - TASK_STORAGE_MODE=${TASK_STORAGE_MODE:-compat}
      # Brief 0069: the proxies whose X-Forwarded-For the login limiter believes. Empty (the
      # default) believes none; nginx's address is then not counted as a source at all (it
      # would be one budget for everybody), so only the account and global budgets apply.
      # Set in the host .env, before the deploy; see docs/operations.md.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # The login budget (brief 0069). Listed so a value in the host .env reaches the container;
      # each default is the Settings default, because an empty value would not parse and the
      # backend would not boot. test_login_budget.py pins every line.
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-10}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-300}
      - LOGIN_SOURCE_RATE_LIMIT=${LOGIN_SOURCE_RATE_LIMIT:-30}
      - LOGIN_GLOBAL_RATE_LIMIT=${LOGIN_GLOBAL_RATE_LIMIT:-300}
      - LOGIN_RATE_MAX_KEYS=${LOGIN_RATE_MAX_KEYS:-10000}
      # Brief 0070: legacy API keys are refused from this day; earlier only, never later.
      - API_KEY_LEGACY_CUTOFF=${API_KEY_LEGACY_CUTOFF:-2027-01-15}
      # Brief 0071: the MCP in-flight budget, total and per source.
      - MCP_MAX_INFLIGHT=${MCP_MAX_INFLIGHT:-32}
      - MCP_SOURCE_MAX_INFLIGHT=${MCP_SOURCE_MAX_INFLIGHT:-8}
      # Brief 0073: the audit file's size above which the hourly measurement warns (RISK-OPS-006).
      - AUDIT_DB_WARN_BYTES=${AUDIT_DB_WARN_BYTES:-104857600}
    networks:
      - traefik-public
    # Lands with the next deploy through the mechanism above; until that deploy runs, the host
    # is still on Docker's default json-file driver with no size limit.
    #
    # 10m x 5 caps each service at 50 MB. The backend now writes a JSON line per request and
    # the same disk holds users.db and data/, so an unbounded log is a full disk that takes
    # the database down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # A container that crash-loops on startup is otherwise indistinguishable from a healthy
    # one: `docker compose up -d` returns success either way. On 2026-08-04 that gap kept a
    # dead backend in production through two green deploys (ADR 0004). Python rather than
    # curl because the runtime image ships no HTTP client. Verified against the running
    # container before this was applied.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/ulrichschinz/runway-frontend:${RUNWAY_SHA:-latest}
    restart: unless-stopped
    # The expand step (ADR 0048, SHIM-OPS-002). The image runs as its own uid 10002 and writes
    # only /tmp, where its command puts the generated server config, the pid file and nginx's
    # temp files. This block deliberately keeps the previous deploy's shape — no `user:`, a
    # writable root, Docker's default capabilities, none of them effective for uid 10002 — so the
    # previous frontend image (root nginx, writing /etc/nginx/conf.d) still starts under it and
    # pinning RUNWAY_SHA rolls back. Both images start under the tmpfs and no-new-privileges.
    # The frontend switch change adds `user: "10002:10002"`, `read_only: true` and
    # `cap_drop: [ALL]`; RULE-OPS-004 requires exactly this shape until SHIM-OPS-002 is removed.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    environment:
      - BACKEND_HOST=backend
    depends_on:
      backend:
        # `depends_on: [backend]` waits for started, not healthy — which is what this file
        # had, and it means the frontend can come up in front of a dead backend.
        condition: service_healthy
    networks:
      - traefik-public
    # Lands with the next deploy — see the backend service above.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.runway.rule=Host(`runway.agentic-reach.com`)"
      - "traefik.http.routers.runway.entrypoints=websecure"
      - "traefik.http.routers.runway.tls.certresolver=letsencrypt"
      - "traefik.http.services.runway.loadbalancer.server.port=4000"

networks:
  traefik-public:
    external: true
