# Structural baseline — checked in, and a RATCHET.
#
# Fan-in is the number of distinct files importing a file. A single high value is never a
# failure by itself: a shared kernel, a composition root and a single egress point are all
# meant to be depended on. What matters is a value GROWING, which is how a module quietly
# becomes the thing everything needs before anyone decides it should be.
#
# RULE-ARCH-003 fails when any file exceeds its recorded value. Raising a number here is
# allowed, but it is a visible, reviewable act rather than a silent drift.
#
# Regenerate the observed numbers with:  python3 tools/index/boundaries.py

default_cap = 4

# Legitimate hubs, exempt by design rather than by baseline.
allowlist = [
  "backend/app/models.py",  # DTOs — a shared kernel every router legitimately depends on
  "backend/app/config.py",  # settings — same
  "frontend/src/api/client.js",  # the single HTTP egress; concentration here is the design
  "frontend/src/components/AppShell.vue",  # the layout every view wraps itself in
]

[hubs]
"backend/app/database.py" = 7
# Recorded on 2026-08-28 with the audit log. Five dependents is the shape of the thing: an
# audit writer is a single sink that everything with an event to record reaches — the auth
# dependency, three routers and the lifespan. Concentration here is the design, exactly as it
# is for the HTTP egress point below; what would be a real signal is a SIXTH, because that
# means a new class of event and a new call site to review for what it puts in a row.
"backend/app/audit.py" = 5
"frontend/src/components/TaskList.vue" = 6
"frontend/src/components/TaskModal.vue" = 6
# Raised from 5 on 2026-08-25: /inbox stopped implementing its own authentication and
# now depends on get_current_user like every other router (finding SEC-6). One more
# dependent on the auth choke point is the intended shape of that fix — the alternative
# was a second auth implementation, which is what was wrong.
"backend/app/dependencies.py" = 6
"frontend/src/stores/tasks.js" = 5
"frontend/src/views/_useTaskView.js" = 5
