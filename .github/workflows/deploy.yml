name: Build and Deploy

# Nothing is built and nothing is shipped unless VERIFY passes first.
#
# Before 2026-08-04 this workflow went straight from push to build to deploy with no
# verification of any kind. On that date two runs reported success while shipping a
# backend that could not start: mcp 2.0.0 broke an unpinned transitive dependency, the
# image built fine because the failure was at import time, the registry push succeeded,
# and the service was down. See docs/adr/0004-pin-transitive-mcp.md.
#
# The `verify` job below is the same reusable workflow that guards every pull request.

on:
  push:
    branches: [main]

# Deliberately NOT cancel-in-progress, unlike verify.yml. Cancelling a gate is free — the
# only loss is compute on an answer nobody needs. Cancelling a deploy is not: the host's
# script refreshes the on-disk compose, pulls, and then runs `docker compose up -d`, and an
# interruption part-way through leaves production in a state nobody chose, with no signal
# that it happened. Superseded deploys therefore queue and run in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: runway

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    # Measured at roughly 90s across the August runs. Fifteen minutes is ten times the
    # observed cost — enough headroom for a cold layer cache, tight enough that a hung
    # build is not discovered by someone noticing it hours later.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required because the build steps below pin `platforms:`, which the default docker
      # driver cannot satisfy. On a GitHub-hosted runner buildx is present but not set up
      # as the active builder.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Every image carries an immutable commit-SHA tag alongside :latest. Without one
      # there is no rollback target — :latest cannot name a previous build.
      #
      # `platforms` is pinned rather than left to the runner. Unpinned, this action builds
      # for whatever architecture the runner happens to be, which is correct on a hosted
      # x86_64 runner only by accident. A build on arm64 would publish an arm64 image as
      # :latest, and the deploy step would then pull it onto an x86_64 host where it dies
      # with `exec format error` — a deploy that takes production down instead of updating
      # it. See docs/adr/0015-pin-the-build-platform.md.
      # The context is the repository ROOT, not ./backend, and the Dockerfile is named
      # explicitly. backend/Dockerfile bakes ops/deploy/docker-compose.yml into the image at
      # /opt/stack/docker-compose.yml, and a file can only enter an image from inside its own
      # build context. Narrowing the context back to ./backend would silently drop the baked
      # compose and return this service to shipping images without its configuration.
      # .dockerignore at the root keeps the context to the backend tree plus that one file.
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}

      - name: Record the rollback target
        run: |
          printf 'Rollback target for this deploy: %s\n' "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          printf 'See docs/operations.md#rolling-back.\n' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # The forced command on the server takes seconds. Five minutes bounds a hung SSH
    # connection without cutting a slow `docker compose pull` short.
    timeout-minutes: 5

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The deploy key carries a forced command, so this string is never executed as a
          # script. It is delivered as SSH_ORIGINAL_COMMAND and the host ignores it. It is
          # kept only because ssh-action requires a non-empty script, and it names the commit
          # so the connection is legible in the host's auth log.
          #
          # WHAT THE HOST ACTUALLY RUNS, read from the host on 2026-08-31:
          #
          #   command="sudo /opt/scripts/deploy.sh runway",no-port-forwarding,...
          #
          # /opt/scripts/deploy.sh is shared by every service on that host and takes the
          # service name as its argument. It iterates the stack's images, extracts
          # /opt/stack/docker-compose.yml from the first image that carries one, writes it
          # over the on-disk compose, then pulls and runs `up -d --remove-orphans`.
          #
          # This comment previously described a runway-specific script that fetched the
          # compose from raw.githubusercontent at this commit. No such script was ever
          # installed, and the sha below was never read by anything. See ADR 0032.
          script: deploy ${{ github.sha }}
