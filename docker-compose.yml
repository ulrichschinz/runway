services:
  backend:
    build:
      # Root context, matching deploy.yml: backend/Dockerfile copies from backend/ and from
      # ops/deploy/. Kept identical to CI deliberately — a local build that resolves paths
      # differently from the shipped one is a difference nobody sees until it matters.
      context: .
      dockerfile: backend/Dockerfile
      network: host
    # The same hardening and the same mounts as ops/deploy/docker-compose.yml (ADR 0048), so a
    # change that only works with a writable root or as root fails here first. The user
    # defaults to 0:0 because on Linux ./data and ./users.db belong to whoever ran
    # `make bootstrap`; RUNWAY_BACKEND_USER=10001:10001 runs it as the image's unprivileged user once
    # those are handed over (docs/operations.md#container-hardening).
    user: "${RUNWAY_BACKEND_USER:-0:0}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./users.db:/app/db/users.db
    environment:
      - JWT_SECRET=${JWT_SECRET:-changeme-set-in-.env}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - DATA_ROOT=/app/data
      - DB_PATH=/app/db/users.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # SEC-001, ADR 0043: compat serves accounts not yet migrated from data/<username>/;
      # strict refuses them. The list above is explicit and there is no env_file, so without
      # this line setting it in the host .env would not reach the container at all.
      # backend/tests/unit/test_task_storage.py pins it.
      - TASK_STORAGE_MODE=${TASK_STORAGE_MODE:-compat}
      # Brief 0069: the proxies whose X-Forwarded-For the login limiter believes. Empty (the
      # default) believes none; nginx's address is then not counted as a source at all (it
      # would be one budget for everybody), so only the account and global budgets apply.
      # Set in the host .env, before the deploy; see docs/operations.md.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # The login budget (brief 0069). Listed so a value in the host .env reaches the container;
      # each default is the Settings default, because an empty value would not parse and the
      # backend would not boot. test_login_budget.py pins every line.
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-10}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-300}
      - LOGIN_SOURCE_RATE_LIMIT=${LOGIN_SOURCE_RATE_LIMIT:-30}
      - LOGIN_GLOBAL_RATE_LIMIT=${LOGIN_GLOBAL_RATE_LIMIT:-300}
      - LOGIN_RATE_MAX_KEYS=${LOGIN_RATE_MAX_KEYS:-10000}
      # Brief 0070: legacy API keys are refused from this day; earlier only, never later.
      - API_KEY_LEGACY_CUTOFF=${API_KEY_LEGACY_CUTOFF:-2027-01-15}
      # Brief 0071: the MCP in-flight budget, total and per source.
      - MCP_MAX_INFLIGHT=${MCP_MAX_INFLIGHT:-32}
      - MCP_SOURCE_MAX_INFLIGHT=${MCP_SOURCE_MAX_INFLIGHT:-8}
    network_mode: host
    restart: unless-stopped
    # The backend now writes a JSON line per request. Docker's default json-file driver has
    # no size limit at all, so an unbounded log is a disk that fills — and on this host the
    # same disk holds users.db and the Taskwarrior data. 10m x 5 caps each service at 50 MB,
    # which is days of traffic at this scale and small enough that nothing else notices.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # A container that crash-loops on startup used to be indistinguishable from a healthy
    # one: `docker compose up -d` returns success either way. On 2026-08-04 that gap kept a
    # dead backend in production through two green deploys (ADR 0004). Python is used
    # rather than curl because the runtime image has no HTTP client installed.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      network: host
    network_mode: host
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
