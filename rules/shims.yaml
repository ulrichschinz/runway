# Compatibility shims — every accepted-but-deprecated shape, with the step that removes it.
#
# `docs/change-workflow.md` requires the migration pattern to be expand → migrate → switch →
# contract, and the contract step is the one that gets skipped: the old shape keeps working,
# nothing fails, and "temporary" becomes permanent by default rather than by decision.
#
# This file is the countdown. `RULE-SEC-002` fails the gate when an entry is missing a field
# or has passed its expiry, exactly as `RULE-RULE-002` does for waivers. A shim that has
# outlived its date is either removed or deliberately re-approved with a new one — both are
# decisions, which is the point.
#
# Every entry records five things:
#   what        the shape being accepted, precisely enough to grep for
#   why         who breaks if it disappears today
#   removal     the step that deletes it, and what must be true first
#   evidence    how we will know nothing depends on it any more
#   expires     the date this stops being acceptable without a fresh decision

version: 1

shims:
  - id: SHIM-SEC-006
    what: >
      `get_current_user` accepts an API key presented as `Authorization: Bearer <api_key>`,
      after a failed JWT decode, in backend/app/dependencies.py.
    why: >
      /inbox authenticated this way through its own inline lookup — a second implementation
      of authentication with a different accepted header shape (finding SEC-6). Unifying it
      onto get_current_user is the fix; removing the old shape in the same change would
      break every agent, MCP client and webhook caller at once, since all of them send the
      key in the Bearer slot today.
    removal: >
      Step 15, moved from Step 13 on 2026-08-26. Step 13 arrived and its precondition did
      not: removal was always conditional on callers having moved, and nothing here can yet
      see what callers send. Removing it on schedule regardless would break every agent and
      MCP client in one step — the exact outcome the shim exists to prevent — so the date
      moved rather than the promise. The expiry did NOT move: 2026-11-25 still stands, and
      RULE-SEC-002 still fails when it passes.
    evidence: >
      The instrument exists as of 2026-08-28 (Step 15c). Every successful authentication
      writes an audit row naming which of the three credential shapes was used and on which
      route, so the question is now a query rather than a guess: run the one under
      "Is anyone still using the Bearer-as-API-key shape?" in docs/operations.md#the-audit-log
      against data/audit.db on the deploy host. It returns the caller, the route and the first
      and last time each was seen; the shape is recorded as `bearer-api-key`.

      What it can prove and what it cannot. Rows are positive evidence: one row means a caller
      still depends on the shape, names them, and names the endpoint. NO rows is only ever
      evidence about the observed window — it says nothing was seen, not that nothing exists,
      and a monthly cron job or a client that has been switched off is exactly what a short
      window misses. So removal needs a soak on the real deployment, long enough to cover the
      slowest caller cycle, starting from the day the audit log is actually deployed. Nothing
      local can produce that, which is why this shim is NOT removed in Step 15 and why the
      expiry has not moved.

      The instrument is also silent in two directions worth knowing. It sees only successful
      authentication, so a caller sending an expired key in the Bearer slot never appears; and
      it only sees what reaches this application, so a client that has migrated but still has
      the old code path is indistinguishable from one that never had it.
    owner: maintainer
    approved_on: 2026-08-25
    expires: 2026-11-25
    re_open_trigger: "the expiry passes, or a caller is found still using the Bearer shape after Step 13"
    decision_record: docs/adr/0018-cors-startup-refusal-and-the-inbox-shim.md

  - id: SHIM-OPS-001
    what: >
      The backend service in ops/deploy/docker-compose.yml runs as
      `user: "${RUNWAY_BACKEND_USER:-0:0}"` — uid 0 unless the host's .env names the image's
      unprivileged user — and drops every default capability except DAC_OVERRIDE instead of
      `cap_drop: [ALL]`. backend/Dockerfile carries uid 10001 but ends on `USER 0:0`, so the
      image behaves as before under a compose that names no user: the previous deploy's file,
      which the host keeps whenever its deploy script does not extract the new one
      (RISK-OPS-002). tools/checks/deploy_compose.py (RULE-OPS-004) accepts exactly this shape,
      requires exactly that `USER`, and only while this entry exists.
    why: >
      Everything under the host's data/ and users.db was written by a root container, and who
      owns it has never been read (plan M0). An image that switched to uid 10001 on its own would
      be unable to write any of it on the deploy that shipped it — every login, every task —
      and a root process without DAC_OVERRIDE would fail the same way on any file root does not
      own (finding SEC-003, ADR 0048).
    removal: >
      The contract step of brief 0076, its own change: the backend's compose user becomes
      "10001:10001", backend/Dockerfile ends on `USER 10001:10001`, `cap_drop: [ALL]`, and
      RUNWAY_BACKEND_USER and this entry go. Before it, the host's on-disk compose must be read
      and found to be this repository's (so the image default no longer matters), and the way
      /opt/scripts/deploy.sh extracts it must be recorded (plan M0). First the
      operator runs /opt/runway/volume_ownership.py in dry-run, then with --apply, then in
      dry-run again with no change and no anomaly left, sets RUNWAY_BACKEND_USER=10001:10001 in
      the host's .env, and the backend runs that way for 14 days without a write failure
      (docs/operations.md#container-hardening).
    evidence: >
      On the host: `docker compose exec backend id -u` answers 10001, the dry-run exits 0, and
      the backend's log shows no "unable to open database file", "readonly database" or
      Taskwarrior "Error code" line over the soak. All three are reads on the host; nothing in
      this repository or in CI can see them.
    owner: maintainer
    approved_on: 2026-11-24
    expires: 2027-02-28
    re_open_trigger: "the expiry passes, the dry-run reports an anomaly that cannot be resolved by hand, or a write fails as uid 10001"
    decision_record: docs/adr/0048-container-hardening-and-the-browser-edge.md

  - id: SHIM-WEB-001
    what: >
      frontend/nginx.conf sends the strict Content-Security-Policy as
      `Content-Security-Policy-Report-Only`; the enforced `Content-Security-Policy` carries only
      frame-ancestors, object-src, base-uri and form-action. tools/checks/edge_headers.py
      (RULE-OPS-005) accepts the strict policy in the report-only header only while this entry
      exists.
    why: >
      A policy that blocks something the SPA needs breaks the application for every user on the
      deploy that ships it, and the only proof that every view runs under it is a browser using
      every view. The build scan (frontend/tests/cspBuild.test.js) and one headless-browser pass
      (brief 0076) say it should; report-only is how the remaining views get used under it
      before it can break them (plan M7.4, finding SEC-004).
    removal: >
      Its own change: the strict policy moves into `Content-Security-Policy`, the report-only
      header and this entry go, and RULE-OPS-005 then requires the strict policy enforced. First
      the maintainer uses every view of both UIs in production with the browser console open
      for at least 14 days of normal use and sees no "Content-Security-Policy-Report-Only"
      violation. The same change decides FastAPI's interactive docs, which nginx proxies at
      /api/docs and /api/redoc: they load Swagger UI / ReDoc from cdn.jsdelivr.net and run an
      inline script, so they report violations now and break under the enforced policy. Either
      they are turned off (docs_url/redoc_url=None — a public-surface change, through the
      migration pattern) or their breakage is accepted in writing; it is not left to happen.
    evidence: >
      No violation in the console over the soak on any SPA view, recorded with the date in the
      removing change's brief; violations on /api/docs and /api/redoc are expected and do not
      count, but their decision above must be recorded there too. There is no reporting endpoint, deliberately, so the console is the only witness.
    owner: maintainer
    approved_on: 2026-11-24
    expires: 2027-01-15
    re_open_trigger: "the expiry passes, or a violation is seen in production that the build scan did not predict"
    decision_record: docs/adr/0048-container-hardening-and-the-browser-edge.md
