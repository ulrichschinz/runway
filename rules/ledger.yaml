# Runway Rule Ledger — every normative rule in this repository, with its evidence.
#
# Only MUST / MUST NOT / REQUIRED / FORBIDDEN statements get an id. Advice does not.
# Each rule declares how it is enforced:
#
#   executable         a check that fails the gate  (documentation alone is not enforcement)
#   observable         measured and reported, but not blocking
#   human_judgment     cannot be mechanically checked; a named review criterion
#   waiver             a temporary, expiring exception — see rules/waivers.yaml
#
# Every executable rule keeps a negative fixture proving that a genuine violation makes
# the gate fail. A rule whose fixture is missing is not yet proven to work — correct
# execution is not evidence that a gate works.
#
# THE META-RULE: changing any rule means changing the contract, the executable check or
# this ledger entry, and a dated decision record — atomically, in the same commit.
#
# Every rule below has been adversarially verified by tools/fixtures/negative.sh: the
# violation was constructed and the gate observed going red. Step 2 wires that script
# into the verify profile so the proof runs on every gate execution rather than by hand.
# Step 9 adds the validator that enforces this file's own shape.

version: 1

rules:
  - id: RULE-HYG-001
    statement: "Secret-bearing and generated paths MUST NOT be tracked in git."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      .env, users.db and data/ are bind-mounted from the production host. This is a
      public repository, so tracking any of them publishes live credentials and user
      data irreversibly.

  - id: RULE-HYG-002
    statement: ".gitignore MUST cover every secret-bearing and generated path."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      RULE-HYG-001 catches a leak that already happened. This one keeps it from being
      possible in the first place.

  - id: RULE-HYG-003
    statement: >
      A checked-in deployment compose file MUST reference every secret as ${VAR}, never
      carry a literal value.
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#the-deploy-hosts-topology
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      ops/deploy/docker-compose.yml is checked in so the production topology is reviewable
      and diffable, which is only safe while the secrets in it are references resolved from
      a .env that stays on the host. A literal would publish a live credential to a public
      repository, and in a diff it looks almost exactly like the reference it replaced —
      one interpolation removed. RULE-HYG-001 catches a secret-bearing file; this catches a
      secret smuggled into a file that is supposed to be there.

  - id: RULE-TI-001
    statement: >
      Every task-interface command MUST be documented in docs/task-interface.md, and
      every documented command MUST exist and delegate to an executable script.
    class: executable
    check: tools/checks/task-interface.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#commands
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The task interface is the first thing a cold agent reads. An undocumented command
      is invisible to it; a documented but missing command sends it down a dead end.

  - id: RULE-TI-002
    statement: >
      The runtime versions declared in tools/versions.env MUST match the versions the
      Dockerfiles build on.
    class: executable
    check: tools/checks/toolchain-pinning.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#toolchain
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      versions.env is what bootstrap provisions against. Disagreement means every local
      environment is quietly wrong about what production runs.

  - id: RULE-GATE-001
    statement: "A verification profile MUST complete inside its declared runtime budget."
    class: executable
    check: tools/run-profile.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#runtime-budgets
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A slow gate gets bypassed, which is worse than no gate: it teaches contributors
      that green is optional. Budgets live in tools/checks/budgets.conf.

  - id: RULE-TEST-001
    statement: "The backend unit test suite MUST pass."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Until 2026-08-04 this repository had no test of any kind. The unit tier fakes
      Taskwarrior at the task_runner._run seam, so everything above it — argv
      construction, validation, routing, error mapping — executes for real without
      needing the binary, Docker or a network.

  - id: RULE-TEST-002
    statement: >
      The backend suite MUST pass against the real Taskwarrior binary, including the
      cross-tenant isolation tests.
    class: executable
    check: tools/checks/py-test-container.sh
    fixture: >
      no automated fixture — the tier needs Docker and an x86_64 host, neither of which
      the offline sandbox has. Recorded as RISK-TEST-002.
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The only boundary between two users' tasks is three environment variables handed to
      a subprocess. There is no ownership column and no second gate. That property cannot
      be tested against a fake, because the fake is the thing that would have to enforce it.

  - id: RULE-TEST-003
    statement: "Backend line coverage MUST NOT fall below the checked-in floor."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A ratchet, not a target. The floor sits below the current figure on purpose: one
      that tracks the exact number turns every unrelated refactor into a coverage failure,
      and a gate that fails for irrelevant reasons is a gate people learn to bypass.


  - id: RULE-TEST-004
    statement: "The frontend logic test suite MUST pass."
    class: executable
    check: tools/checks/js-test.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to pure logic modules. The frontend defects this repository has actually
      shipped — c6ce0f2 and 472b673, both context-tag comma-splitting — were in pure
      functions, not in component rendering. Testing where the bugs were beats testing
      where tests are conventional.

  - id: RULE-TEST-005
    statement: >
      integrations/claude/install.sh MUST pass integrations/claude/tests/install_test.sh: it
      installs the committed state of a ref and never an uncommitted edit, reports --check as
      exit 0 or 1, refuses a symlinked target with 73, and fails on an unknown ref with 66.
      integrations/claude/hooks/runway-summary.sh MUST pass
      integrations/claude/tests/hook_test.sh: silent without its environment, silent on any
      error and when nothing is due, and exactly one line of counters — no task or project
      name, no key — when a review is due.
    class: executable
    check: tools/checks/skill.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-claude-skill
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The script writes into the user's ~/.claude, where what an agent runs on must be a
      released state somebody chose to install. Its two refusals — the working tree and a
      symlink into it — are the whole point of it, and a script whose refusals nobody has
      watched fire is not holding them. See ADR 0035.

      The hook is the second script this repository ships to a user's machine, and the only
      one that runs by itself: at the start of every session, in every repository. Its whole
      promise is negative — no output, no traceback, no credential, no task title, no delay —
      and a promise of silence is exactly the kind nobody notices breaking until it has been
      broken for weeks. The test stubs curl, so it holds without a server or a key. See
      ADR 0041.

  - id: RULE-IDX-001
    statement: "The index MUST be current with the working tree."
    class: executable
    check: tools/checks/index-fresh.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      A stale index is worse than no index: it answers confidently and wrongly. Exit 4 is
      reserved for it — the answer would have been unreliable, so no answer is given.

  - id: RULE-IDX-002
    statement: >
      Rebuilding the index from unchanged sources MUST produce a byte-identical export.
    class: executable
    check: tools/checks/index-deterministic.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      ADR 0008 removed the incremental build path so that "incremental and clean rebuilds
      are equivalent" holds by construction. This keeps that claim honest: unordered
      iteration or a timestamp would break it silently, and a graph that changes without
      its sources changing cannot be trusted to say anything.

  - id: RULE-IDX-003
    statement: "The index MUST pass its qualification suite."
    class: executable
    check: tools/checks/index-qualified.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Installation is not proof of compliance. A qualification failure means the index is
      lying — asserting relationships that are wrong, or dressing a declaration up as a
      parsed fact — which is worse than having no index, because the answers are believed.

  - id: RULE-IDX-004
    statement: "The CLI and MCP adapters MUST return the same facts."
    class: executable
    check: tools/checks/index-parity.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Two access paths over one query layer is only worth having if they cannot disagree.
      If an agent on MCP and a human on the CLI can reach different conclusions about the
      same code, the index has two truths and neither is trustworthy. Both adapters call
      query.py and add no logic of their own, so parity is provable rather than hoped for.

  - id: RULE-TI-003
    statement: >
      Every command's JSON=1 output MUST be a single valid JSON object on stdout, with
      nothing else mixed in.
    class: executable
    check: tools/checks/json-output.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#machine-readable-output
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Agents parse this stream. A check that prints a friendly summary without honouring
      JSON mode corrupts it for every consumer while the human output still looks
      perfect — which is exactly how two such bugs reached CI before this rule existed.

  - id: RULE-GOV-001
    statement: >
      The live branch protection MUST match the checked-in desired state in
      ops/github/ruleset.json.
    class: executable
    check: tools/checks/branch-protection.sh
    fixture: >
      manual, against the live GitHub API — see docs/operations.md#governance-drift-evidence.
      Verified 2026-08-04 against three real drift scenarios: enforcement disabled, a rule
      removed, and a bypass actor added. It cannot run in the offline fixture sandbox,
      which is recorded as RISK-GOV-003.
    contract: docs/operations.md#branch-protection
    fix: tools/apply-ruleset.sh
    owner: maintainer
    non_waivable: false
    rationale: >
      A protection that can be switched off in a web UI without leaving a trace is not a
      control. The checked-in file is canonical and drift away from it is detectable.

  - id: RULE-GOV-002
    statement: >
      A decay review MUST have been run inside the review period, and its recorded
      evidence MUST verify: the report hash recomputes, and the revision it names is an
      ancestor of HEAD.
    class: executable
    check: tools/checks/decay-freshness.sh
    fixture: >
      tools/fixtures/negative.sh — the overdue arm: a valid, correctly hashed report is
      backdated past its own overdue_after_days and the gate goes red. The unverifiable
      arm (one byte changed in a field the hash covers) was constructed and observed by
      hand on 2026-08-30 and is recorded in docs/briefs/0023-the-decay-review.md. It was
      left unautomated on the ground that a second arm would overstate the rule count —
      which was wrong twice over, and Step 16d's audit is where that surfaced: the suite
      was counting arms rather than rules, so the two numbers were never equal, and the
      arm would have added no rule to the coverage set in any case. The reason it stays
      unautomated is now the honest one: the overdue arm already proves the check reads
      the evidence and can go red, and a second arm re-runs a two-second report to assert
      a hash comparison one line away from the first.
    contract: docs/task-interface.md#the-decay-review
    fix: ./run decay-review
    owner: maintainer
    non_waivable: false
    rationale: >
      Every other rule here asks whether a change is allowed. This one asks whether the
      review that watches the other rules for rot is still happening — which no individual
      run can answer, because rot leaves every check green. A baseline that only ever rises
      has stopped being a ratchet, a waiver whose owner has moved on is not a decision
      anyone is making, and an index whose extractors drifted answers confidently and
      wrongly. None of that fails verify.

      The check reads ops/decay-review.json and never AGENTS.md. The contract may display
      the date of the last review; a contract that is the SOURCE of that date is a document
      asserting its own freshness, which is the exact failure being guarded against.

      It deliberately does not read the review's findings. Judging content would make this
      a second gate over six diagnostics with thresholds and no fixtures, and the first
      time it blocked a merge the thresholds would be tuned until it stopped. It proves the
      review happened; that it does not prove anyone acted on it is RISK-GOV-005.

  - id: RULE-ARCH-001
    statement: >
      A unit dependency that architecture.toml does not allow MUST fail the gate.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The index is descriptive and architecture.toml is normative. An edge that exists
      never legitimises one the contract forbids. This rule is what stops the declared
      structure from becoming a description of the past.

  - id: RULE-ARCH-002
    statement: >
      A new cycle between units MUST fail. Declared cycles are inventoried with an owner
      and a teardown path, under a ratchet that may only shrink.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A cycle is the one structural fact that is never accidental-but-fine: it means two
      units cannot be understood, tested or replaced independently. The ratchet also fails
      when a declared cycle is resolved but left declared, so improvements are locked in
      rather than quietly forgotten.

  - id: RULE-ARCH-003
    statement: "Fan-in MUST NOT exceed the checked-in structural baseline."
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A single high fan-in is never a failure by itself — a shared kernel and a single
      egress point are meant to be depended on. What matters is the value GROWING, which
      is how a module becomes the thing everything needs before anyone decided it should
      be. Raising a baseline is allowed; doing it silently is not.

  - id: RULE-DEP-001
    statement: >
      The backend application MUST import cleanly from its pinned dependency set — the
      service must be able to start.
    class: executable
    check: tools/checks/py-import.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-service-must-be-able-to-start
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      This rule exists because the situation it forbids actually happened. fastapi-mcp
      0.3.3 requires mcp>=1.6.0 with no upper bound; mcp 2.0.0 changed Server.__init__,
      so every image built after that release held a backend that raised TypeError
      before uvicorn bound a port. The image built, the push succeeded, the deploy job
      went green, and the service was down. It is the cheapest possible check that the
      thing being shipped can run at all.

  - id: RULE-SEC-001
    statement: >
      Every HTTP and WebSocket route the booted application serves — wherever it is declared, framework and
      transport routes included — MUST declare its required guard in rules/route-guards.toml, the
      declaration MUST match the guard the route's resolved dependency tree enforces, every
      operation in the served OpenAPI schema MUST be in that inventory, and a route declared open
      MUST record why.
    class: executable
    check: tools/checks/route-guards.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-route-guard-declaration
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A forgotten guard fails silently: the route works, it just works for everybody. That
      is not something a green test suite notices, and it is not something a reviewer
      reliably notices either, because the evidence is one missing parameter default among
      thirty handlers. Declaring the posture as checked-in state turns "did anyone think
      about authorization for this route" into a question the gate answers. Open routes
      carry a reason because a route anyone can reach is a decision, and a decision with no
      recorded reason cannot be told apart from an oversight. The inventory became the running
      application on 2026-11-25 (brief 0073, ADR 0047): reading one directory left six served
      routes undeclared, and a route beside GET /health would have shipped green (RISK-SEC-005).
      A WebSocket route has no HTTP method and no OpenAPI entry; it is declared as `WS <path>`,
      and a route kind the checker cannot classify fails the gate instead of being skipped.

  - id: RULE-SEC-002
    statement: >
      Every compatibility shim MUST be recorded in rules/shims.yaml with what, why, a
      removal step, evidence, an owner and an expiry, and no shim may be past its expiry.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/change-workflow.md#public-surface-or-data-migration
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Expand → migrate → switch → contract only works if the contract step happens, and it
      is the step that gets skipped: the old shape keeps working, nothing fails, and
      "temporary" becomes permanent by default rather than by decision. The countdown has
      to be enforced by something that goes red, exactly as RULE-RULE-002 does for waivers.
      A date nothing checks is a wish.

  - id: RULE-SEC-003
    statement: >
      Only backend/app/task_storage.py may build a path from the data root: no other module of
      the serving application may read `data_root` from settings or from the resolver, except
      database.audit_db_path for the audit database's fixed name.
    class: executable
    check: tools/checks/storage-binding.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-taskwarrior-boundary
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Finding SEC-001 was `settings.data_root / username`, written in two modules, with nothing
      but review between a caller-chosen name and the directory Taskwarrior opened: `alice/../alice`
      was alice's store. Brief 0065 names every store by a random, immutable storage id and decides
      the directory in one function that refuses anything but a real directory directly under the
      resolved root. A second place that builds paths from the root is how the finding comes back,
      and it would arrive looking like an ordinary convenience. Non-waivable because the store is
      the only tenancy boundary the system has. Name-based and static — see RISK-SEC-006 for what
      the rule does not see.

  - id: RULE-ARCH-004
    statement: >
      A standard-library module listed in architecture.toml's restricted_imports MUST NOT be
      imported anywhere inside its declared scope except the files that declaration allows.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-taskwarrior-boundary
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      task_runner is the single place this application invokes the Taskwarrior binary, and
      that is the only reason its argv hardening is a control rather than a convention
      (finding SEC-3). A second module importing subprocess would bypass the `--` separator
      and the override refusal with nothing going red — an easy change to make by accident
      while chasing something else. A choke point only works while it stays the only door,
      and "stays" is a property that needs enforcing rather than intending.

  - id: RULE-SURF-001
    statement: >
      Every protected public surface — the served OpenAPI schema, the runtime MCP tool list,
      the migrated database schema, the Taskwarrior template, and the SPA routes and
      localStorage keys — MUST match its snapshot in ops/surfaces/.
    class: executable
    check: tools/checks/surfaces.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: ./run surfaces --update
    owner: maintainer
    non_waivable: false
    rationale: >
      These are treated as externally consumed, and the failure mode is silence: renaming a
      route handler function renames its MCP tool, which breaks every client, and the diff
      shows only a Python rename. The snapshot does not prevent the change — it makes the
      change appear in a file a human has to commit. Runtime observation rather than
      declaration is the point: the contract claimed for months that MCP tool names were
      handler function names, and booting the app showed they are operation ids. Zero of the
      seven tool names the README documented existed.

  - id: RULE-SURF-002
    statement: >
      Every environment variable the application reads MUST be documented in README.md, and
      every variable documented there MUST be read by the application.
    class: executable
    check: tools/checks/surfaces.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Both directions are failures with the same shape — a configuration surface that lies.
      A documented variable nothing reads gives an operator silence instead of an effect;
      README documented PORT that way, and this check is what finally caught it. An
      undocumented variable the app does read is a knob nobody can find, which is how
      CORS_ORIGINS, BOOTSTRAP_ADMIN and the rate-limit settings all shipped.

  - id: RULE-SURF-003
    statement: >
      Every route the Claude skill names in its operation table
      (integrations/claude/skills/runway/references/conventions.md, "Which operation for
      what") MUST exist in ops/surfaces/openapi.json, and every mcp__runway__ tool it names
      anywhere under integrations/claude/ MUST exist in ops/surfaces/mcp-tools.json. Lines
      marked "if present" are exempt.
    class: executable
    check: tools/checks/skill.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-claude-skill
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The skill is a consumer of the public surface that ships from this repository, so a
      route rename can break it in the same pull request. RULE-SURF-001 makes the rename
      visible; this rule makes the consumer it breaks visible too. "If present" is the
      skill's own convention for operations a newer server may have, and the exemption keeps
      that graceful degradation possible. See ADR 0035.

  - id: RULE-SURF-004
    statement: >
      A change to anything under integrations/claude/skills/ or integrations/claude/hooks/
      MUST come with a raised `version` in integrations/claude/.claude-plugin/plugin.json,
      recorded in ops/skill-release.json.
    class: executable
    check: tools/checks/skill.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-claude-skill
    fix: ./run surfaces --update
    owner: maintainer
    non_waivable: false
    rationale: >
      Claude Code delivers a plugin update only when its version changes, so an edit without
      a bump reaches nobody who installed the plugin — and nothing says so. The record holds a
      content hash of the skill, which makes the check independent of any git base: it works
      the same in CI, locally and in the fixture sandbox. `./run surfaces --update` refuses to
      rewrite the record when the content changed and the version did not. See ADR 0035.

      Since ADR 0041 the hash covers hooks/ as well: the plugin delivers a shell script that
      runs at the start of every session, it reaches users through the same version bump the
      skill does, and a stale copy of it is worse than stale skill text — the skill is read
      by a model that can notice it is wrong, the hook is executed.

  - id: RULE-SURF-005
    statement: >
      The schema init_db() produces from an empty file and from every historical baseline in
      backend/tests/fixtures/schema_history/ MUST be semantically identical — columns in order with
      type, NOT NULL, default and key; CHECK clauses; AUTOINCREMENT; indexes by columns, uniqueness
      and predicate; foreign keys; triggers; and the applied schema version.
    class: executable
    check: tools/checks/surfaces.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#make-surfaces
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      RULE-SURF-001 snapshots the schema a fresh database gets, and production is not a fresh
      database: it was created in April 2026 and migrated by ALTER TABLE ever since. For seven months
      the snapshot recorded an api_key UNIQUE constraint and a column order production did not have,
      and the rule compared the snapshot against itself and passed (RISK-SURF-001). The upgrade path
      has to be built and compared, not assumed. Statement text is not compared — the same schema is
      spelled differently by CREATE and by ALTER — what it means is. A schema change now goes into
      VERSIONED_MIGRATIONS, which runs on both paths; a CREATE edited instead fails here because a
      database that already has the table never sees the edit. Brief 0073, ADR 0047.

  - id: RULE-DEP-002
    statement: >
      Every dependency's licence MUST be classified by policy/licenses.yaml, and MUST NOT be
      forbidden, unclassified, absent, or an unapproved review case.
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: policy/licenses.yaml
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      This repository publishes container images publicly, so a dependency's licence is an
      obligation passed on to whoever redeploys them. Strong copyleft would carry source
      obligations onto them, which this project does not ask. Unknown fails closed on purpose:
      a dependency whose licence nobody could determine is not one whose licence is fine, it
      is one nobody has looked at. The escape hatch costs a minute of reading rather than a
      suppression.

  - id: RULE-DEP-003
    statement: "No credential may be committed to this repository."
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      RULE-HYG-001 keeps secret-bearing paths out of git and RULE-HYG-003 keeps literals out
      of the deployment compose. Neither catches the ordinary case: a key pasted into a source
      file, a fixture or a documentation example, in a file that belongs here. This repository
      is public, so a committed credential is disclosed the moment it is pushed and rotation
      is the only remedy — the cheapest moment to catch it is before the push.

      Extended 2026-11-25 (brief 0070, ADR 0044 Decision 6) to this application's own API keys,
      `rwk_<16 hex>_<43-character secret>`: a real key pasted into a test or an example is a
      working credential in a public repository. Proved by the `DEP-003-apikey` arm, which
      commits one built at run time; the scan before this change passed it.

  - id: RULE-DEP-004
    statement: >
      Every base image MUST be pinned by digest, Arch packages MUST come from a dated archive
      snapshot rather than live mirrors, and Python dependencies MUST install from a
      hash-pinned lock with --require-hashes.
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md
    fix: ./run lock
    owner: maintainer
    non_waivable: false
    rationale: >
      A floating tag means what ships is a function of the calendar rather than of the commit.
      This repository has been bitten twice: mcp 2.0.0 shipped a backend that could not start
      through a green deploy on 2026-08-04, and Taskwarrior rolled forward under
      archlinux:latest on 2026-08-25 and broke every container test on an unchanged backend.
      The archive snapshot is checked separately from the digest because a digest does not pin
      what pacman installs — pacman resolves against live mirrors at build time, so without it
      the binary version is still whatever Arch published that day.

  - id: RULE-DEP-005
    statement: >
      Every direct dependency in backend/requirements.txt and backend/requirements-dev.txt
      MUST be an exact pin, and the lock compiled from it MUST install exactly that version;
      a lock MUST NOT keep a direct dependency no intent file declares.
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#make-lock
    fix: ./run lock
    owner: maintainer
    non_waivable: false
    rationale: >
      RULE-DEP-004 checks the lock's form — present and hashed — and was read as checking
      that the lock matches the intent. It never did. A bump to requirements.txt alone, the
      shape every Dependabot pip pull request takes, passed verify and changed nothing in the
      image, which installs the lock; found on 2026-09-18 while checking Dependabot #26. The
      same hole as the MCP defect of ADR 0033: an artefact verified by its form rather than
      by the claim people read it as making. See ADR 0034.

  - id: RULE-DOC-001
    statement: "Every factual claim in AGENTS.md MUST hold against the repository."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A document nobody verifies drifts, and a drifted contract is worse than no contract
      because it is followed. Paths, commands, identifiers and the counted public-surface
      claims are all checked against the actual repository and the index — except the MCP
      tool count, which is checked against the observed snapshot ops/surfaces/mcp-tools.json
      (itself held to the booted server by RULE-SURF-001). Since the MCP surface became an
      allowlist the index, which derives one tool per route, over-counts it (ADR 0037).

  - id: RULE-DOC-002
    statement: "AGENTS.md MUST stay within 250 lines and 12000 bytes."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A contract nobody finishes reading is a contract nobody follows. The budget forces
      detail into linked documents, where it can grow without costing the entry point.

  - id: RULE-DOC-003
    statement: >
      A scoped contract MUST point at the root contract and MUST NOT define rules of its
      own.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped contracts refine local structure; they never weaken a root rule. A rule
      defined in two places is a rule with two meanings, so definition lives only in the
      ledger.

  - id: RULE-DOC-004
    statement: >
      Every reference in an accepted decision record or change brief MUST resolve: each
      cited RULE/RISK/BLIND/WAIVER/CYCLE identifier is declared, each relative link
      resolves, and each ADR referred to in prose exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/change-workflow.md#the-change-impact-brief
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      RULE-DOC-001 keeps the contract honest, but the contract is 168 lines and delegates
      the detail to the records it points at. Those were unchecked, and two had drifted:
      one ADR cited a risk id the ledger does not declare, another named the index
      manifest with the wrong file extension. A dangling reference in a decision record is
      followed exactly as readily as one in the contract, and costs more to discover
      because the reader assumes the record is authoritative. Only references with a
      ground truth to resolve against are checked — see ADR 0016 and RISK-DOC-002 for what
      is deliberately left out. Superseded and rejected records are exempt: they describe
      a world that has moved on, and editing them to keep a gate green falsifies the
      history they exist to preserve.

  - id: RULE-DOC-005
    statement: >
      Every rule's contract: pointer MUST resolve — the file exists, and where an #anchor
      is given, the file carries a heading that produces it.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#adding-a-check
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The contract: field is not documentation about a rule; it is the text a gate failure
      prints. fail_rule in tools/lib.sh reads it and emits it as the why: line, so it is
      the one moment a rule gets to teach the reader the part of the contract they just
      violated. A pointer at a renamed heading still prints, still looks authoritative,
      and sends the reader to the top of a document instead of to the paragraph that
      explains the failure — and nothing anywhere would have said so. All forty-four
      pointers were audited by hand in Step 16d and all forty-four resolved; this rule is
      the ratchet that keeps them there, not a repair of something broken. It is deliberately
      narrower than RISK-DOC-002's rejected path-in-prose check: a contract: value is a
      structured field with exactly one meaning, so there is no prose to disambiguate.

  - id: RULE-RULE-001
    statement: >
      Every rule in the ledger MUST declare a statement, class, check, contract, owner and
      rationale, and every executable rule MUST name a fixture that exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The ledger is the register of what this repository enforces. An entry missing its
      check or its fixture is a claim of enforcement with nothing behind it.

  - id: RULE-RULE-002
    statement: >
      No waiver may be expired, and each MUST record rule, scope, reason, alternatives,
      risk, mitigation, owner, approver, expiry, re-open trigger and resolution.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A waiver without an expiry is a permanent exception wearing a temporary label. Four
      waivers expire 2026-11-04; when that date passes the gate stops, which is the point.

  - id: RULE-RULE-003
    statement: >
      Every inline suppression MUST correspond to a waiver or a reviewed justified
      suppression.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Suppressing a finding silently is the one thing that turns a gate into theatre. A
      noqa with a waiver id is a decision; a bare noqa is a decision nobody made.

  - id: RULE-FMT-001
    statement: "Backend Python MUST be formatted by `ruff format`."
    class: executable
    check: tools/checks/py-format.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Formatting arguments are a tax on every review. One tool decides, nobody argues,
      and the fix is a single command — so a formatting failure never costs thinking.

  - id: RULE-LINT-001
    statement: "Backend Python MUST pass `ruff check` with the repository's rule selection."
    class: executable
    check: tools/checks/py-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      The selection includes flake8-bandit (S), which is how SEC-1, SEC-3 and the silent
      migration except-clause became visible as gate findings rather than prose in a
      report. Suppressions require an entry in rules/waivers.yaml.

  - id: RULE-LINT-002
    statement: "Frontend JavaScript and Vue MUST pass `eslint`."
    class: executable
    check: tools/checks/js-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to vue/essential — correctness rules only, no template formatting opinions.
      See ADR 0003 for why, and for the trigger to widen it.

  - id: RULE-TYPE-001
    statement: "Backend Python MUST pass `mypy` with the repository's configuration."
    class: executable
    check: tools/checks/py-types.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      `check_untyped_defs` is enabled deliberately: it is what surfaced the unchecked
      `Row | None` indexing in two request handlers (WAIVER-TYPE-001), a class of latent
      500 that no test in this repository would have caught.

  - id: RULE-GATE-002
    statement: >
      Every executable rule MUST have a negative fixture proving that a genuine
      violation makes the gate fail.
    class: executable
    check: tools/checks/gate-conformance.sh
    fixture: >
      self-proving, and therefore unautomated: this rule IS tools/fixtures/negative.sh.
      An arm that made gate-conformance.sh go red would have to make the suite fail from
      inside itself, running every other arm a second time to do it. What is left
      unobserved is the wrapper — that a failing suite really does turn into a red gate —
      and that is recorded as RISK-GATE-001.
    contract: docs/task-interface.md#gate-conformance
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A gate component that has never been observed failing is not a rule; it is a shell
      call nobody has tested, and it is worse than nothing because it is believed. This
      rule is why every other rule in this ledger can be trusted.

  - id: RULE-OPS-001
    statement: >
      Every blocking outward call the serving application makes — process execution and
      network egress — MUST declare a timeout at the call site.
    class: executable
    check: tools/checks/timeouts.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#timeouts
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A call with no timeout does not fail, it waits, and the worker serving the request
      waits with it. There is one Taskwarrior binary behind every list this application
      renders, so a `task` invocation that never returns is not a slow page — it is a worker
      that never comes back, and enough of them is an outage with nothing in any log to
      explain it. The application makes exactly one such call today and it already declares
      `timeout=10`; the rule costs nothing now and exists so that stays true when the second
      one is added, most likely by someone who never read this file. Scoped to backend/app/
      because repository tooling already runs inside the gate's own runtime budget
      (RULE-GATE-001). It checks declaration, not sufficiency — see RISK-OPS-003.

  - id: RULE-OPS-002
    statement: >
      No credential may reach a log line: the serving application MUST NOT pass a
      credential-bearing expression — a secret, password or password hash, token, API key or
      bearer credential — to a logging call, in the message, in an interpolation, or in the
      structured fields.
    class: executable
    check: tools/checks/log-secrets.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#no-secrets-in-logs
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A credential in the database is a credential under a control; the same credential in a
      log line is one in a file, a backup and someone's scrollback, kept for as long as the
      retention policy says. Nothing raises and nothing errors, so the disclosure is invisible
      until somebody reads the file — and by then rotation, not deletion, is the only remedy,
      exactly as for RULE-DEP-003. The application has no logging at all today, so the property
      holds for free and stops holding in the first commit that adds a logger; the rule lands
      before the logging module rather than after it, because the reviewer who would catch
      logger.info(f"login {body.password}") is the same reviewer reading a hundred new lines of
      logging plumbing. Scoped to backend/app/, the only code whose output reaches a production
      log. The check reads source, not emitted output, so it holds whichever transport Step 15a
      settles on. It matches credential-bearing names, so it cannot see a credential arriving
      under a neutral name — see RISK-OPS-004.

  - id: RULE-OPS-003
    statement: >
      The deploy compose file MUST NOT ask the host for privilege, for its network namespace,
      or for a bind mount whose source lies outside the service directory.
    class: executable
    check: tools/checks/deploy-compose.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#the-deploy-mechanism
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Until 2026-08-28 the deploy key could only pull images and restart; the compose file was
      maintained by hand on the host and ops/deploy/docker-compose.yml was a transcription of
      it. A transcription is accurate on the day it is taken, and three claims this repository
      made about production were each true when written and each drifted silently afterwards —
      every one of them found by reading the host rather than by anything failing. So the
      compose file became part of the deployed artefact, which removes the drift and widens what
      a merge to main can reach: compose can mount host paths, join the host network namespace
      and ask for privilege, none of which application code can do from inside a container. This
      rule is the boundary on that widening. It does not sandbox the deployment and does not
      pretend to — whoever can merge can still change what the services run. It refuses the
      specific edits that turn a container-scoped change into a host-scoped one, in a file that
      is easy to skim past in review because it is mostly YAML nobody reads twice.

# Residual risks — properties that matter but cannot currently be made executable.
# Each carries the trigger that should re-open it.
residual_risks:
  - id: RISK-DOC-001
    statement: >
      "Query the index before searching or editing by hand" cannot be mechanically
      enforced — nothing can detect that someone grepped instead. The mitigation is that
      obeying it is faster than not: ./run map and ./run impact answer in under a second
      with evidence classes and blind spots attached.
    owner: maintainer
    re_open_trigger: "a change lands that the index would have flagged, and nobody queried it"
    decision_record: AGENTS.md

  - id: RISK-OPS-003
    statement: >
      RULE-OPS-001 checks that a timeout is declared, not that it is sensible. A call
      written with timeout=86400 satisfies the rule and helps nobody; so does one whose
      timeout is longer than the reverse proxy's own read timeout, which turns a bounded
      wait into a 504 with a worker still blocked behind it. Declaration is mechanically
      checkable and sufficiency is not — the right value depends on what the callee does,
      what the caller promised, and what sits in front of both. The check also knows only
      the process and HTTP-client shapes it lists: a blocking call through a library it has
      not been taught is invisible to it.
    owner: maintainer
    re_open_trigger: "a second egress client is introduced, a timeout is observed firing in production, or a reverse-proxy read timeout is set below an application timeout"
    decision_record: docs/adr/0022-timeouts-are-declared.md

  - id: RISK-OPS-004
    statement: >
      RULE-OPS-002 is a name-based static scan, and it is bounded on both sides in the same
      way RISK-DEP-002 records for secret_scan.py. It sees a credential that is *called* one —
      body.password, settings.jwt_secret, x_api_key, credentials.credentials, new_key — and it
      is blind to the same value under a neutral name: logging `body`, `row`, `value` or a
      request object discloses the password with nothing to match on, and so does a credential
      assembled at runtime or returned by a function whose name does not say so. It reads only
      backend/app/, so a credential logged by a library, by uvicorn's own access logger, or by
      an exception traceback that happens to carry one is outside it entirely. And it recognises
      loggers by import, by assignment from getLogger, and by a receiver named like a logger:
      a logger reached some other way is a hole. The per-line `log-secrets: allow` marker is
      deliberately greppable so the standing exemptions stay reviewable.
    owner: maintainer
    re_open_trigger: "a credential is found in a production log that the scan did not report, an exemption marker is used more than twice, or a logging library is introduced that this scan does not recognise"
    decision_record: docs/adr/0023-no-secrets-in-logs.md

  - id: RISK-OPS-005
    statement: >
      The runtime redaction filter in backend/app/logging_setup.py is the second half of a
      two-part control and it is bounded in the mirror image of the first. It removes a value
      by the field name it arrives under, and by the shapes it has been taught — a JWT, a
      bcrypt hash, an Argon2id PHC string (added with brief 0067, when that format was
      introduced), an API key in the hashed-key format `rwk_<16 hex>_<secret>` (added with
      brief 0070, when that format was introduced), the 43-character token_urlsafe(32) a legacy
      API key is, and the resolved JWT_SECRET matched literally. The SHA-256 an API key is stored
      as has no distinctive shape — 64 hex characters are also every digest this application
      handles — so it is kept out of the stream by never being logged, by its name (`secret_hash`;
      `secret` is in both vocabularies, proved by the `OPS-002-apikey-hash` arm) and by the
      acceptance search in test_api_keys.py, not by this filter. It is therefore blind to a credential that has neither: a
      user's password is an arbitrary string under an arbitrary name, so `logger.info("got",
      extra={"detail": password})` survives the filter and is caught only by RULE-OPS-002 at
      the call site — and only while the name says what it is. A credential minted by some
      future scheme with a different shape is invisible until the shape is added here. The
      api-key shape is also a false-positive risk in the other direction: any unbroken
      43-character run of the URL-safe alphabet is redacted, which costs a log line its
      usefulness rather than costing a disclosure, and that is the trade this takes
      deliberately. Finally, the filter covers only what passes through this process's
      handler: anything written before configure_logging runs, or by a sidecar, is outside it.
    owner: maintainer
    re_open_trigger: "a credential is found in a log line that both RULE-OPS-002 and the filter passed, a new credential format is introduced, or the api-key shape is observed redacting something an operator needed"
    decision_record: docs/adr/0024-structured-logging.md

  - id: RISK-DOC-004
    statement: >
      Prose rots and nothing detects it. RULE-DOC-001 checks the factual claims in AGENTS.md
      against the repository, and RULE-DOC-004 resolves identifiers named in records — but no
      check reads an ordinary paragraph in docs/ and asks whether it is still true. Found on
      2026-08-30: docs/task-interface.md's "Known gaps" section still claimed there was not a
      single test in this repository and that an expired waiver could not fail the gate, both
      fixed in Steps 3 and 9 and both false for weeks. That is the fourth stale claim found on
      this branch; the other three were about production (RISK-OPS-002) and were caught by
      reading the host. The common shape is a statement that was true when written, describing
      something that later changed elsewhere, with no link between the two. The decay review
      cannot see this either — every diagnostic it runs measures structure, and a paragraph is
      not structure.

      Re-opened 2026-08-31. The fifth was found, and it was the largest: docs/operations.md,
      deploy.yml and ops/deploy/docker-compose.yml all described a runway-specific forced
      command that fetched the compose file at the deployed commit. It was written, reviewed
      and merged; it was never installed, and no forced command ever pointed at it. Unlike the
      first four this claim was not true when written — the repository described a mechanism it
      had authored rather than one it had observed, and nothing in the gate can tell those two
      apart. The trigger below is deliberately not re-armed with a sixth count: counting them
      has not prevented one. See ADR 0032.
    owner: maintainer
    re_open_trigger: "a documented claim about the deploy host is found false again, or a check exists that reads a host fact rather than a repository fact"
    decision_record: docs/adr/0032-the-deploy-mechanism-correction.md

  - id: RISK-ARCH-001
    statement: >
      `./run scaffold KIND=backend-feature` raises the `RULE-ARCH-003` hub baseline for
      backend/app/dependencies.py itself, because every guarded route imports get_current_user
      and a generated feature is one more importer. The raise is honest — it lands in the diff
      with a dated comment naming the command that made it, and a human still commits it — but
      a ratchet a machine can advance no longer measures what it was built to measure. Before
      this, a rising fan-in on the auth choke point meant somebody should look; now it means
      either that, or that scaffold ran. Those two are indistinguishable in the number alone,
      and the second is common while the first is rare, which is the wrong way round for a
      signal. The alternative considered and rejected was allowlisting dependencies.py, which
      drops the signal permanently rather than blunting it. Observed twice already: one
      generated feature took the baseline 6 → 7, a second took it to 8.
    owner: maintainer
    re_open_trigger: "a third generated backend feature, or a fan-in rise on dependencies.py that no scaffold run explains"
    decision_record: docs/adr/0029-the-scaffold-generator.md

  - id: RISK-SURF-001
    statement: >
      Closed in this repository on 2026-11-25 (brief 0073, ADR 0047); open until production
      reports it. The drift: CREATE_USERS declared `api_key TEXT UNIQUE` while a database migrated by
      ALTER TABLE — production, created in April 2026 — had plain TEXT and another column order, and
      ops/surfaces/db-schema.sql described only the fresh path, so RULE-SURF-001 compared the snapshot
      against itself and passed. Now: versioned step 1 rebuilds `users` into one declared shape on
      both paths (plain `api_key TEXT`, as production has it; the column goes with the API-key
      contract), and RULE-SURF-005 builds every historical baseline in
      backend/tests/fixtures/schema_history/ and requires it to mean what a fresh database means.
      What is not yet evidence: that production ran step 1. A role that is neither 'user' nor 'admin'
      refuses the step and leaves the old shape in place; verify-deploy compares the
      `schema_version` production reports with the snapshot's and fails until it matches.
    owner: maintainer
    re_open_trigger: "verify-deploy reports a schema_version below the snapshot's, a historical database shape is found that the baselines do not cover, or a schema change lands outside VERSIONED_MIGRATIONS"
    decision_record: docs/adr/0047-audit-retention-and-versioned-migrations.md

  - id: RISK-OPS-002
    statement: >
      The deploy host's compose file is checked in as ops/deploy/docker-compose.yml, but
      nothing compares it against the host. It matched on 2026-08-24; after that an edit on
      either side silently makes the other wrong, and the failure mode is a reader trusting
      the copy. A gate check cannot close this — CI has no access to the deploy host — so
      it needs a scheduled job running somewhere that does. Two claims this repository made
      about production were already false when the file was first read: the healthchecks
      did not run there, and the rollback runbook's RUNWAY_SHA had nothing to substitute
      into. Both are fixed in the checked-in copy.

      Narrowed 2026-08-31. backend/Dockerfile now bakes the file into the backend image at
      /opt/stack/docker-compose.yml, and the host's shared deploy script writes it over the
      on-disk copy on every deploy. Drift is therefore corrected by each deploy rather than
      detected, which is stronger than the comparison job this risk originally asked for. What
      remains open, and is why this stays a risk: nothing verifies that the write happened.
      The host script's extraction loop falls through silently for an image that carries no
      baked file, which is exactly how this service spent six days shipping images without its
      configuration while every deploy reported success. A deploy that stops baking the file
      looks identical to one that never needed to.

      Narrowed 2026-09-20. CI has no host access, but it does have HTTP, and the running
      server can now answer for itself: the verify-deploy job in .github/workflows/deploy.yml
      polls GET /api/skill until it reports the commit that was just pushed, then compares the
      skill version and content hash it serves against plugin.json and ops/skill-release.json,
      checks /api/health, and downloads the zip. So "the deploy reported success" and "this
      commit is serving production" are no longer the same claim, and an image that lost the
      skill tree to a .dockerignore edit — green in every gate, 503 in production — fails
      here instead of being discovered by a user. What stays open is the host's own file:
      nothing reads /opt/services/runway/docker-compose.yml, so a compose that drifted, or a
      deploy that never rewrote it, still looks exactly like one that did as long as the
      containers it already runs answer correctly.

      Narrowed 2026-11-25 (brief 0073, ADR 0047 Decision 4). The deploy compose now mounts its
      own file read-only into the backend, and GET /skill reports the SHA-256 of that host-applied
      file beside the SHA-256 of the compose baked into the image, the build id (the workflow run
      that pushed the image) and the schema version. verify-deploy requires all four to match this
      run and this commit, and requires the registry's :latest and :<sha> to resolve to the digest
      build-and-push pushed; a stubbed run of both steps fails for each mismatch
      (test_deploy_evidence.py). What remains: CI still cannot ask the host which digest its
      container runs — the chain is the build id plus the registry digest — and nothing compares
      anything between deploys. That a deploy of this change actually passed the new checks is a
      production observation not yet made.
    owner: maintainer
    re_open_trigger: "verify-deploy fails on the applied compose, the build id or the digest, the host gains a way to report its container's image digest, or a documented topology claim is found to be false again"
    decision_record: docs/adr/0047-audit-retention-and-versioned-migrations.md

  - id: RISK-DOC-002
    statement: >
      RULE-DOC-004 does not resolve file paths named in the prose of decision records and
      briefs, only identifiers, links and ADR numbers. A record naming a file the way
      prose does can point at the wrong file, or at one that no longer exists, and the
      gate stays green. Two drafts tried to check paths and both produced false positives
      on correct records, because nothing syntactic separates a reference from a mention
      of something that was never built. The mitigation is a convention rather than a
      control: records point at files with links, which are checked. Anchor targets within
      those links are likewise unverified.
    owner: maintainer
    re_open_trigger: "a record's prose filename is found to point at the wrong file, a renamed section leaves a link resolving to the wrong place, or a reliable signal is found that separates a reference from a mention"
    decision_record: docs/adr/0016-briefs-are-generated-references-are-checked.md

  - id: RISK-IDX-001
    statement: >
      The MCP adapter speaks JSON-RPC as specified and is tested at the protocol level,
      but has not been exercised against a real MCP client from this environment. The CLI
      is the path with no such caveat.
    owner: maintainer
    re_open_trigger: "someone connects a real MCP client, or a client reports a protocol error"
    decision_record: docs/adr/0008-index-implementation-mode.md

  - id: RISK-TEST-004
    statement: >
      Frontend rendering, routing, keyboard handling, swipe gestures and dark mode are
      covered by no test. The suite deliberately covers pure logic only.
    owner: maintainer
    re_open_trigger: "a defect that only manifests in a mounted component or across the SPA/API boundary"
    decision_record: docs/adr/0007-frontend-test-scope.md

  - id: RISK-DEP-001
    statement: >
      RESOLVED 2026-08-26 by Step 14. The base image is digest-pinned and the package
      repository is pinned to the Arch Linux Archive snapshot of 2026-08-25, so `task` is
      reproducible at 3.5.0. What remains is the cost of that choice: the archive snapshot is
      a date someone must move deliberately, and a snapshot left alone for a year silently
      accumulates unpatched packages. Dependabot does not watch it — nothing announces that a
      pinned archive date has aged.
    owner: maintainer
    re_open_trigger: "the archive snapshot date is more than six months old, or archive.archlinux.org stops serving the pinned date"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-DEP-003
    statement: >
      Narrowed on 2026-11-24 by brief 0067, whose password-hashing migration was this risk's
      re-open trigger. passlib (unmaintained since 2020-10-08) is gone: new passwords are hashed
      with Argon2id by argon2-cffi, and the bcrypt hashes passlib wrote are verified by the bcrypt
      package directly, against vectors passlib itself produced (test_password_kdf.py). What
      remains: bcrypt 4.0.1 stays pinned, now only to verify those legacy hashes until the
      contract step of SHIM-SEC-009 removes it. The pin is no longer load-bearing — app/auth.py
      truncates to 72 bytes itself, so bcrypt 5's refusal of longer input would not break a
      login — but moving it is a change of its own. argon2-cffi-bindings is a native extension
      pinned in the intent file to a release older than two weeks.
    owner: maintainer
    re_open_trigger: "a bcrypt or argon2-cffi advisory is published, the bcrypt pin blocks a fix, or SHIM-SEC-009's contract step removes bcrypt"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-DEP-002
    statement: >
      Secret scanning is pattern-based. It catches provider-issued credentials by their
      prefixes and high-entropy assignments to credential-shaped names; it will miss a secret
      that looks like ordinary prose, one split across lines, or one encoded. It also only
      reads the current tree — a credential committed and later deleted stays in history and
      stays disclosed. Rotation, not deletion, remains the remedy.
    owner: maintainer
    re_open_trigger: "a credential is found in this repository that the scanner did not report, or history rewriting is ever considered as a remedy"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-SEC-003
    statement: >
      Login rate limiting is in-process and per-worker: the counters live in module memory,
      reset on restart, and are not shared between processes. Under one host and one worker
      (decision F1) that is the whole population, so the limit is real; add a second worker
      or a second host and every budget multiplies by the process count. Since brief 0069 the
      budget is reserved before the account lookup and the KDF, in three tiers (normalised
      username, network source behind TRUSTED_PROXIES, global), in a store bounded by TTL, a
      clock-driven sweep and a hard key cap — that part of the risk (REV-003) is closed and
      tested, for the login and for the current-password check of PUT /auth/password. What
      remains is the process boundary, and the lockout trade it was always paired with, which
      lasts as long as the attack (a spray is repeated every window): someone who knows a
      username can deny it password login (10 failures per 5 minutes), and 300 failures per 5
      minutes from anywhere (10 IPv4 sources, or one IPv6 /60) deny every account password
      login. Until the operator sets TRUSTED_PROXIES the source tier is off behind nginx (a
      proxy-shaped peer is not counted), so a spray is bounded by the global brake alone.
      Requests with an API key are not throttled, so agents, MCP clients and the webhook keep
      working through a lockout — and a lockout does nothing against what a stolen key can do,
      except guess the password. The trigger is executable but reads files only:
      backend/tests/unit/test_login_budget.py (TestTheSingleWorkerAssumption,
      TestTheSingleWorkerPinIsWholeFile) fails when the Dockerfile's CMD stops pinning
      --workers 1, the Dockerfile sets WEB_CONCURRENCY, an ENTRYPOINT or gunicorn, or a compose
      file sets WEB_CONCURRENCY, replicas, scale or --workers.
    owner: maintainer
    re_open_trigger: "a second worker or host is introduced (TestTheSingleWorkerAssumption or TestTheSingleWorkerPinIsWholeFile goes red), an account or global lockout is used against a real user, or the deploy runs with TRUSTED_PROXIES unset for longer than the rollout"
    decision_record: docs/security.md

  - id: RISK-SEC-001
    statement: >
      The frontend's role check is cosmetic. `auth.role` in the Vue store is read from
      localStorage, so a viewer can make the admin UI render for themselves. Every /admin
      route is guarded server-side, so the result is a screen full of 403s rather than
      access — a display bug, not a privilege escalation. Making it honest means deriving
      the role from a server response on every mount rather than from client storage.
    owner: maintainer
    re_open_trigger: "any admin-only behaviour is implemented in the frontend without a server-side guard behind it"
    decision_record: docs/security.md

  - id: RISK-SEC-002
    statement: >
      Closed in this repository on 2026-11-25 (brief 0073, ADR 0047); open until production
      reports it. Versioned step 1 rebuilds `users` with `role TEXT NOT NULL DEFAULT 'user'
      CHECK (role IN ('user', 'admin'))`, so a value written outside the application — by hand on the
      host or by a future migration — is refused by the database; NULL and '' (what every reader
      already treated as 'user') become 'user'. A database that already holds another value refuses
      the step, logs `schema migration refused` with a count, and keeps the old unconstrained column,
      where every in-application writer still validates against VALID_ROLES and an unrecognised value
      is not 'admin' (fail closed). Whether production holds such a row is a production read; until
      verify-deploy has seen schema_version 1 the constraint is not known to be in force there. The
      constraint does not stop an operator writing 'admin': that is a role.
    owner: maintainer
    re_open_trigger: "verify-deploy reports schema_version 0, a third role is introduced, or the users table is rebuilt again"
    decision_record: docs/security.md

  - id: RISK-SEC-006
    statement: >
      SEC-001 is contained but not closed until the operator has migrated. Accounts created
      before brief 0065 keep storage_layout='legacy' and are served from DATA_ROOT/<username>/ in
      the default `compat` mode (SHIM-SEC-007) — only when the name is one path component that
      is, in exactly that spelling, a real directory directly under the root, so a separator,
      `.`/`..`, a symlink, a storage-id-shaped name, or a spelling a case- or
      normalisation-insensitive filesystem only reaches by folding it (`ALICE` opening `alice`)
      is refused. The migration groups legacy accounts by the inode their raw name opens, so
      such a pair is blocked there too. That the production volume is case- and
      normalisation-sensitive (ext4 is expected) is an operator check, not something this
      repository can see. Whether production holds an alias account already is unknown from
      this repository; the migration's dry run answers it. RULE-SEC-003 is a static scan of
      backend/app/ by name: a path built from os.environ, from a copied value, or by a library is
      outside it. The container tier that proves isolation against the real binary runs only in
      CI on amd64 (RISK-TEST-001); locally it was run against the host's Taskwarrior 3.5.0.
    owner: maintainer
    re_open_trigger: "the migration's plan reports an alias or a blocked account in production, TASK_STORAGE_MODE=strict is set (downgrade this risk), SHIM-SEC-007 expires, or the legacy directories are removed (close it)"
    decision_record: docs/adr/0043-account-identity-and-taskwarrior-storage.md

  - id: RISK-TEST-001
    statement: >
      The container test tier cannot run on arm64: archlinux publishes no arm64 image and
      pacman fails under amd64 emulation. An Apple Silicon developer never exercises the
      real Taskwarrior binary locally and sees that tier only in CI.
    owner: maintainer
    re_open_trigger: "a second developer joins on arm64, or CI stops running x86_64"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-002
    statement: >
      RULE-TEST-002 has no automated negative fixture. The offline fixture sandbox has
      neither Docker nor an x86_64 host, so the container tier cannot be made to fail
      there on demand.
    owner: maintainer
    re_open_trigger: "the fixture sandbox gains Docker and an x86_64 host, or a regression is found that the container tier would have caught and the prose fixture let through"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-003
    statement: >
      The suite runs Argon2id at reduced parameters (t=1, 8 KiB) and bcrypt at cost 4 so the
      gate stays inside its runtime budget (backend/tests/conftest.py, marked test-only). Since
      brief 0067 exactly one test hashes and verifies at the production Argon2id parameters,
      so they are proven valid and consistent with the constants — but no test measures their
      latency or memory on the deploy host, and the cost-12 bcrypt dummy runs in production only.
      The latency budget (250 ms, 64 MiB) rests on the operator's measurement with
      `python -m app.auth` on that host.
    owner: maintainer
    re_open_trigger: "the password hashing scheme or its parameters change, or a login is observed slower than the documented budget"
    decision_record: backend/tests/conftest.py

  - id: RISK-GOV-001
    statement: >
      Required-reviewer enforcement is impossible with a single maintainer: the only
      person who can approve a change is the person who wrote it. No control in this
      repository provides independent review of a change to the rules themselves.
    owner: maintainer
    re_open_trigger: "a second contributor gains write access to the repository"
    decision_record: docs/plan/phase-0-2.md F4

  - id: RISK-GOV-002
    statement: >
      tools/checks/branch-protection.sh needs network and an authenticated gh. Where it
      cannot reach GitHub it reports that and does not fail, so a run on an offline
      machine proves nothing about the live governance state. The trigger here used to
      name Step 16c as the thing that would close this. Step 16c landed on 2026-08-30 and
      did not: none of its six diagnostics touches the rulesets API, so the trigger named
      an event that had already passed without occurring and could never fire. Corrected
      by the Step 16d audit.
    owner: maintainer
    re_open_trigger: "a decay-review diagnostic reads the live rulesets API and records the result in ops/decay-review.json, or a protection change is found on GitHub that no local run reported"
    decision_record: docs/adr/0005-gate-the-deploy.md

  - id: RISK-GOV-003
    statement: >
      RULE-GOV-001 has no automated negative fixture. Its violations were constructed and
      observed by hand against the live API because the offline fixture sandbox has no
      GitHub to drift from.
    owner: maintainer
    re_open_trigger: "a recorded or stubbed rulesets response makes the three drift arms runnable offline, or a live drift is found that no local run had reported"
    decision_record: docs/operations.md

  - id: RISK-GOV-004
    statement: >
      A decay review run outside CI carries no run id. ops/decay-review.json records the
      absence honestly rather than inventing one, and RULE-GOV-002 accepts the report —
      requiring a run id would make the rule unsatisfiable on the maintainer's machine and
      would bind a governance rule to one vendor's CI. What is therefore unattested is the
      environment: the hash proves the file was not edited after it was written, and the
      revision check proves it describes a commit this branch contains, but nothing proves
      the operator ran the real command rather than producing a well-formed file by hand,
      and nothing proves the toolchain was the declared one. A CI-produced review carries
      the run id and the clean-clone bootstrap; a local one carries neither.
    owner: maintainer
    re_open_trigger: "a decay review is found whose recorded findings do not match the revision it names, or the monthly workflow is removed"
    decision_record: docs/adr/0030-the-decay-review.md

  - id: RISK-GOV-005
    statement: >
      RULE-GOV-002 proves that a decay review happened and that its evidence verifies. It
      never reads the findings, so a report whose result is `attention` — an approaching
      expiry, an unattributed ratchet raise, a failing cold-agent assertion — is as green
      as one with nothing in it. Acting on a review is human judgment and is unenforceable
      by the same argument as RISK-DOC-001. The mitigation is that the findings are in a
      checked-in file that changes in a reviewable diff every month, not in a log nobody
      keeps.
    owner: maintainer
    re_open_trigger: "a finding is carried unchanged across three consecutive reviews"
    decision_record: docs/adr/0030-the-decay-review.md

  - id: RISK-TI-001
    statement: >
      RULE-TI-003 says every command's JSON=1 output must be a single valid JSON object.
      tools/checks/json-output.sh validates five of the twenty-one commands — check, the
      resolved plan, doctor, help and the decay review — because the rest either mutate
      state, need arguments, or take minutes. The rule's statement is therefore wider than
      its check, and a command whose JSON mode is broken outside that five is caught by
      nothing. Found by the first decay review, 2026-08-30.
    owner: maintainer
    re_open_trigger: "an agent reports unparseable JSON from a command the check does not cover"
    decision_record: docs/adr/0030-the-decay-review.md

  - id: RISK-ARCH-002
    statement: >
      Five of the seven fan-in baselines in ops/structure-baseline.toml carry no comment
      saying who raised them or why — backend/app/database.py,
      frontend/src/components/TaskList.vue, frontend/src/components/TaskModal.vue,
      frontend/src/stores/tasks.js and frontend/src/views/_useTaskView.js. They were
      recorded as observed values when RULE-ARCH-003 was introduced, so each is a ceiling
      nobody argued for. Combined with RISK-ARCH-001 — a raise a machine can perform — the
      inventory now contains three kinds of number that read identically: measured,
      reasoned, and generated. The decay review reports the split every month.
      Found by the first decay review, 2026-08-30.
    owner: maintainer
    re_open_trigger: "an unattributed baseline is raised, or the count of unattributed baselines rises"
    decision_record: docs/adr/0030-the-decay-review.md

  - id: RISK-BOOTSTRAP-001
    statement: >
      The non-uv bootstrap path (python3 -m venv against a system interpreter) is not
      exercised by CI; only `make doctor`'s warning covers it.
    owner: maintainer
    re_open_trigger: "a contributor reports a bootstrap failure, or a second CI runner image is added"
    decision_record: docs/adr/0002-python-interpreter-provisioning.md

  - id: RISK-MCP-001
    statement: >
      The index derives its mcp_tool nodes from route declarations, while the surface
      snapshot derives them by booting the app. Two producers of the same fact, and only one
      of them is observed. The names differ in form — the index records the handler
      function name, the snapshot records the operation id — so a query answered from the
      index gives a tool name no client would recognise. Since the MCP surface became an
      allowlist (ADR 0037) the index is also over-inclusive: it still derives one tool per
      route, including the auth and admin routes that are REST-only, so index mcp_tool
      nodes say nothing about membership. RULE-DOC-001 therefore counts tools from the
      snapshot. Making the extractor read the snapshot would close it.
    owner: maintainer
    re_open_trigger: "an index consumer relies on mcp_tool membership, an index query returns an mcp_tool name that does not appear in ops/surfaces/mcp-tools.json, or the extractor is changed to read the snapshot"
    decision_record: docs/adr/0020-runtime-observed-surfaces.md

  - id: RISK-MCP-002
    statement: >
      The MCP endpoint itself is unauthenticated: anyone who can reach /api/mcp may complete a
      handshake and list all 27 tools — names, descriptions and input schemas — without a
      credential. Every tool CALL is authenticated by the REST endpoint it is forwarded to, and
      since brief 0071 may reach only that endpoint (REV-005,
      tests/unit/test_mcp_target_binding.py). Since brief 0071 an anonymous handshake also costs
      no session: the transport is stateless, a request without a credential header holds at
      most a quarter of the in-flight budget, and it is torn down when it ends (REV-004,
      tests/unit/test_mcp_budget.py). The share counts a header's presence, not its validity:
      a made-up header escapes it, though not the global and per-source ceilings. What remains is disclosure of the inventory, which is
      published in README.md and ops/surfaces/mcp-tools.json anyway, so it stays accepted.
      Closing it — authenticating every MCP request before the transport, behind a dated soak —
      is designed (ADR 0045) and deferred: it makes backend/app/mcp_gate.py an importer of
      backend/app/dependencies.py, a fan-in ratchet raise (RULE-ARCH-003) the owner decides.
    owner: maintainer
    re_open_trigger: "a tool is added whose name or description reveals something not already public, the endpoint is exposed on a network where enumeration itself matters, or the owner approves the dependencies.py fan-in raise"
    decision_record: docs/adr/0045-mcp-authentication-and-resource-budget.md

  - id: RISK-OPS-006
    statement: >
      NOTHING PRUNES THE AUDIT DATABASE — but since 2026-11-25 (brief 0073, ADR 0047) something
      measures it. `data/audit.db` grows for the lifetime of the deployment, about 150 bytes per
      successfully authenticated request, on the partition that holds `users.db` and the Taskwarrior
      data. The backend now stats the file (with -wal and -shm) at boot and hourly, keeps the largest
      size seen as a high-water mark in the file's audit_meta table, and logs `audit store size` at
      INFO, at WARNING above AUDIT_DB_WARN_BYTES (default 100 MiB). That makes the growth visible; it
      does not bound it. Bounding it needs a retention period, and choosing what may be forgotten has
      a legal and an operational half — SHIM-SEC-006's evidence, revocations, role changes and storage
      migrations must outlive their own evidence period — that is the operator's decision (plan gate
      D7), not taken. ADR 0047 Decision 1 records what the retention job must respect when it is
      built. Nothing alerts outside the log stream, and nothing measures the partition's free space.
      The amplification by login failures is bounded by the login budget (brief 0069).
    owner: maintainer
    re_open_trigger: "a WARNING 'audit store size' is logged, a retention period is agreed (D7), disk pressure is observed on the deploy host, or the SHIM-SEC-006 soak completes and the evidence is no longer needed live"
    decision_record: docs/adr/0047-audit-retention-and-versioned-migrations.md

  - id: RISK-OPS-001
    statement: >
      `platforms: linux/amd64` in deploy.yml is a declaration, not an enforced invariant.
      Nothing in the gate inspects the architecture of a pushed image, so an edit that
      removes the pin would publish an image matching whatever runner built it, and the
      failure would surface only as `exec format error` on the production host after the
      deploy had already replaced the running container.
    owner: maintainer
    re_open_trigger: "a second deployment target on a different architecture, or a build that runs anywhere other than a hosted x86_64 runner"
    decision_record: docs/adr/0015-pin-the-build-platform.md

  - id: RISK-DOC-003
    statement: >
      docs/threat-model.md is an assertion, not a derived artefact. Every claim in it was
      read out of the code by hand on 2026-08-28 and cited to a file and a line, and nothing
      re-derives any of it: line numbers move on the next edit, a new router or a new
      credential shape appears in no section until somebody adds it, and the gate stays green
      throughout. That is the same class of decay RULE-DOC-001 exists to prevent in AGENTS.md
      and RULE-DOC-004 in the records — and neither reaches this file, because the contract
      check reads AGENTS.md and the reference resolver reads docs/adr/ and docs/briefs/ only.
      Making it executable is not obviously possible: most of what a threat model asserts is
      an absence ("no egress", "no second auth path", "no credential in a row"), and an
      absence has no syntax to scan for. What IS mechanically held is held by the rules the
      document names section by section, which is why it names them rather than restating
      them; the residue is this risk. The mitigation is a convention: the document states,
      per section, which claims are enforced and which are only asserted, so a reader can
      see what the gate is not doing for them.
    owner: maintainer
    re_open_trigger: "a claim in docs/threat-model.md is found to be false, a new trust boundary or credential shape is added without a section describing it, or a decay review (Step 16c) is asked to carry this document"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-OPS-007
    statement: >
      The application makes NO network egress, and nothing keeps it that way. Verified
      2026-08-28: no import of httpx, requests, urllib, aiohttp, http.client, socket or
      smtplib appears anywhere under backend/app/, so the only outward call the serving
      process makes is the Taskwarrior subprocess. That absence is what the egress half of
      the threat model rests on, and it is an observation about today's tree rather than an
      invariant. Nothing forbids the first egress call and nothing announces it: httpx is
      already installed as a transitive dependency of mcp, so adding one is an import away.
      RULE-OPS-001 is the closest control and it is deliberately narrower — it requires a
      timeout on an egress call once one exists, which makes the first one survivable, not
      visible. RULE-ARCH-004 restricts subprocess to task_runner and could be extended to
      the HTTP clients, but that would forbid egress outright rather than route it through a
      declared boundary, and no such boundary has been designed. So the honest statement is:
      an agent adding an outbound call would satisfy every rule in the gate, and the threat
      model's egress section would silently become wrong.
    owner: maintainer
    re_open_trigger: "any module under backend/app/ imports an HTTP or socket client, an outbound integration is designed, or restricted_imports in architecture.toml is extended to cover egress"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-SEC-004
    statement: >
      Narrowed 2026-11-25 by brief 0073 (plan M8): every free-text field a request carries is now
      bounded in backend/app/models.py — a username at 256 characters at login and registration
      (before it reaches an audit row or a log line; audit.py also cuts actor and subject at 256),
      a task description at 2 000 characters, an annotation and an inbox note at 32 KiB of UTF-8
      (the cut capping.js and Android's Capping.kt already make), date-like fields at 64, tags at
      100 each and 50 per task, plan texts at 20 000 — and one past a limit is 422 while the body is
      parsed, before any handler runs; MCP tool calls meet the same bounds through the tool input
      schema and the route. The largest Taskwarrior argument is therefore at most 32 KiB, a
      quarter of Linux's MAX_ARG_STRLEN, and an E2BIG that still occurs is task_runner.ArgumentTooLong, answered 413,
      not 500. What remains is volume, not size: nothing bounds how many tasks, annotations or plan
      revisions one account writes, so a user's own store can still grow on the partition that
      holds users.db and audit.db (RISK-OPS-006). That is a capacity question decision F1 keeps
      out of scope, recorded rather than assumed. The kernel limit itself was still not reproduced
      here (the development host is macOS); the 413 path is tested at the subprocess seam.
    owner: maintainer
    re_open_trigger: "a 500 is observed from a long field, a field is added to a request model without a bound, disk usage grows from task data rather than from logs or audit rows, or F1's capacity exclusion is revisited"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-SEC-005
    statement: >
      Narrowed 2026-11-25 by brief 0073 (plan M8). RULE-SEC-001 used to glob backend/app/routers/*.py,
      so GET /health, the three methods of /mcp and the framework's documentation routes were served
      and declared nowhere, and a route added beside them would have needed no guard decision. The
      checker now boots the application and inventories fastapi.routing.iter_route_contexts(app.routes),
      reads each guard from the resolved dependency tree (router-level dependencies included),
      requires every served OpenAPI operation to be in the inventory and a Mount to be declared; the
      eight routes are declared open with reasons, and a negative fixture puts a route in main.py.
      What remains is outside the application object: a path the nginx in front answers itself
      (the SPA and its fallback), and a handler that authenticates inside its body rather than by
      dependency — the checker classifies it open, so it must be declared open with a reason, but
      the checker cannot tell whether that reason is true.
    owner: maintainer
    re_open_trigger: "a route authenticates without get_current_user/get_current_admin, nginx answers an API path itself, a sub-application is mounted, or fastapi.routing.iter_route_contexts changes meaning"
    decision_record: docs/adr/0047-audit-retention-and-versioned-migrations.md

  # --- found by the Phase 4 audit, Step 16d (docs/adr/0031-the-phase-4-audit.md) ------

  - id: RISK-GATE-001
    statement: >
      RULE-GATE-002 is the rule that makes every other rule trustworthy, and it is the one
      rule nobody has watched fail. tools/checks/gate-conformance.sh runs the fixture suite
      and turns a non-zero exit into a gate failure; that wrapper — the three lines between
      a failing fixture and a red gate — has never been exercised, because the only way to
      exercise it is to make the suite fail from inside itself, which means running every
      other arm a second time inside the sandbox and roughly doubling the runtime of verify.
      The exposure is narrow and it is real: if the wrapper's condition were inverted, or if
      it swallowed the exit code, every conformance run since Step 2 would have reported the
      same green and meant nothing. What holds it today is that the suite is invoked by
      tools/run-profile.sh, which classifies any non-zero exit, and that the fixtures'
      sandbox aborts when the pristine tree is not green.
    owner: maintainer
    re_open_trigger: "gate-conformance.sh grows a second execution path, a fixture failure is observed reaching a green verify, or the fixture suite gains a mode cheap enough to nest"
    decision_record: docs/adr/0031-the-phase-4-audit.md

  - id: RISK-GATE-002
    statement: >
      The gate's own Python is not linted, formatted or type-checked. ruff runs over
      backend/app, backend/tests and tools/index; mypy's files list is backend/app alone. That
      leaves fifteen modules and about 4,300 lines outside every one of them — the ten check
      implementations under tools/checks/ and the five command implementations tools/brief.py,
      tools/decay_review.py, tools/grant-admin.py, tools/scaffold.py and tools/surfaces.py.
      These are the programs that decide whether a change is mergeable and the programs an
      agent is told to trust over its own reading of the tree, and they are held to a lower
      standard than the application they judge. Widening the scope is not free — it would land
      a pile of findings in one commit, which is why RULE-LINT-001 was deliberately introduced
      narrow — but the asymmetry was never a decision anyone recorded, and until Step 16d it
      was not written down anywhere.
    owner: maintainer
    re_open_trigger: "a defect in a check script reaches main, ruff or mypy scope is widened for any other reason, or a sixth command implementation is added under tools/"
    decision_record: docs/adr/0031-the-phase-4-audit.md

  - id: RISK-IDX-002
    statement: >
      index/manifest.toml's [unsupported] list and the index's actual blind spots are two
      hand-kept copies of one fact and they had drifted. The manifest listed six mechanisms;
      the graph carries seven, because BLIND-TEST-001 — import-derived test protection, which
      sees no TESTED_BY edge for anything exercised through the FastAPI TestClient — was added
      to tools/index/build.py and never to the manifest. The manifest also still lists
      BLIND-MCP-001 as unsupported, which the graph records as resolved by runtime observation
      in Step 13. Nothing reads [unsupported]: the blind spots a query reports come from
      _declare_global_blind_spots in the builder, so the manifest is prose about the index
      rather than input to it. Both copies are corrected as of 2026-08-30 and nothing keeps
      them together. This matters beyond tidiness because the manifest is what a reader is
      pointed at to learn what the index cannot see, and a benchmark that scores an agent on
      flagging the declared blind spots has to be scored against the right number.
    owner: maintainer
    re_open_trigger: "an eighth blind spot is declared, a blind spot is resolved, or the two lists are found to disagree again"
    decision_record: docs/adr/0031-the-phase-4-audit.md

  - id: RISK-GOV-006
    statement: >
      Nothing in this repository has ever observed branch protection BLOCK a merge. RULE-GOV-001
      compares the live ruleset against ops/github/ruleset.json, which establishes that the
      configuration is what was intended — a different and weaker claim than that a red VERIFY
      stops a merge button. Step 16d confirmed against the live API on 2026-08-30 that the
      main-protection ruleset is active on the default branch with verify as a required status
      check and an empty bypass_actors list, and that is the end of what a read-only,
      pull-request-free check can establish: GitHub evaluates a required status check when a
      merge is attempted, so the enforcing behaviour is only observable by attempting one. The
      blocking half is therefore asserted from configuration, exactly the posture the plan calls
      advice rather than a rule. The procedure that would settle it in about five minutes,
      without merging anything, is written out in docs/adr/0031-the-phase-4-audit.md.
    owner: maintainer
    re_open_trigger: "the blocking test in ADR 0031 is performed and its result recorded, a merge is observed completing over a red verify, or bypass_actors becomes non-empty"
    decision_record: docs/adr/0031-the-phase-4-audit.md
