# Runway Rule Ledger — every normative rule in this repository, with its evidence.
#
# Only MUST / MUST NOT / REQUIRED / FORBIDDEN statements get an id. Advice does not.
# Each rule declares how it is enforced:
#
#   executable         a check that fails the gate  (documentation alone is not enforcement)
#   observable         measured and reported, but not blocking
#   human_judgment     cannot be mechanically checked; a named review criterion
#   waiver             a temporary, expiring exception — see rules/waivers.yaml
#
# Every executable rule keeps a negative fixture proving that a genuine violation makes
# the gate fail. A rule whose fixture is missing is not yet proven to work — correct
# execution is not evidence that a gate works.
#
# THE META-RULE: changing any rule means changing the contract, the executable check or
# this ledger entry, and a dated decision record — atomically, in the same commit.
#
# Every rule below has been adversarially verified by tools/fixtures/negative.sh: the
# violation was constructed and the gate observed going red. Step 2 wires that script
# into the verify profile so the proof runs on every gate execution rather than by hand.
# Step 9 adds the validator that enforces this file's own shape.

version: 1

rules:
  - id: RULE-HYG-001
    statement: "Secret-bearing and generated paths MUST NOT be tracked in git."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      .env, users.db and data/ are bind-mounted from the production host. This is a
      public repository, so tracking any of them publishes live credentials and user
      data irreversibly.

  - id: RULE-HYG-002
    statement: ".gitignore MUST cover every secret-bearing and generated path."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      RULE-HYG-001 catches a leak that already happened. This one keeps it from being
      possible in the first place.

  - id: RULE-TI-001
    statement: >
      Every task-interface command MUST be documented in docs/task-interface.md, and
      every documented command MUST exist and delegate to an executable script.
    class: executable
    check: tools/checks/task-interface.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#commands
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The task interface is the first thing a cold agent reads. An undocumented command
      is invisible to it; a documented but missing command sends it down a dead end.

  - id: RULE-TI-002
    statement: >
      The runtime versions declared in tools/versions.env MUST match the versions the
      Dockerfiles build on.
    class: executable
    check: tools/checks/toolchain-pinning.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#toolchain
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      versions.env is what bootstrap provisions against. Disagreement means every local
      environment is quietly wrong about what production runs.

  - id: RULE-GATE-001
    statement: "A verification profile MUST complete inside its declared runtime budget."
    class: executable
    check: tools/run-profile.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#runtime-budgets
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A slow gate gets bypassed, which is worse than no gate: it teaches contributors
      that green is optional. Budgets live in tools/checks/budgets.conf.

  - id: RULE-TEST-001
    statement: "The backend unit test suite MUST pass."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Until 2026-08-04 this repository had no test of any kind. The unit tier fakes
      Taskwarrior at the task_runner._run seam, so everything above it — argv
      construction, validation, routing, error mapping — executes for real without
      needing the binary, Docker or a network.

  - id: RULE-TEST-002
    statement: >
      The backend suite MUST pass against the real Taskwarrior binary, including the
      cross-tenant isolation tests.
    class: executable
    check: tools/checks/py-test-container.sh
    fixture: >
      no automated fixture — the tier needs Docker and an x86_64 host, neither of which
      the offline sandbox has. Recorded as RISK-TEST-002.
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The only boundary between two users' tasks is three environment variables handed to
      a subprocess. There is no ownership column and no second gate. That property cannot
      be tested against a fake, because the fake is the thing that would have to enforce it.

  - id: RULE-TEST-003
    statement: "Backend line coverage MUST NOT fall below the checked-in floor."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A ratchet, not a target. The floor sits below the current figure on purpose: one
      that tracks the exact number turns every unrelated refactor into a coverage failure,
      and a gate that fails for irrelevant reasons is a gate people learn to bypass.

  - id: RULE-TEST-004
    statement: "The frontend logic test suite MUST pass."
    class: executable
    check: tools/checks/js-test.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to pure logic modules. The frontend defects this repository has actually
      shipped — c6ce0f2 and 472b673, both context-tag comma-splitting — were in pure
      functions, not in component rendering. Testing where the bugs were beats testing
      where tests are conventional.

  - id: RULE-IDX-001
    statement: "The index MUST be current with the working tree."
    class: executable
    check: tools/checks/index-fresh.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: make fix   (or make index)
    owner: maintainer
    non_waivable: false
    rationale: >
      A stale index is worse than no index: it answers confidently and wrongly. Exit 4 is
      reserved for it — the answer would have been unreliable, so no answer is given.

  - id: RULE-IDX-002
    statement: >
      Rebuilding the index from unchanged sources MUST produce a byte-identical export.
    class: executable
    check: tools/checks/index-deterministic.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      ADR 0008 removed the incremental build path so that "incremental and clean rebuilds
      are equivalent" holds by construction. This keeps that claim honest: unordered
      iteration or a timestamp would break it silently, and a graph that changes without
      its sources changing cannot be trusted to say anything.

  - id: RULE-IDX-003
    statement: "The index MUST pass its qualification suite."
    class: executable
    check: tools/checks/index-qualified.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Installation is not proof of compliance. A qualification failure means the index is
      lying — asserting relationships that are wrong, or dressing a declaration up as a
      parsed fact — which is worse than having no index, because the answers are believed.

  - id: RULE-IDX-004
    statement: "The CLI and MCP adapters MUST return the same facts."
    class: executable
    check: tools/checks/index-parity.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Two access paths over one query layer is only worth having if they cannot disagree.
      If an agent on MCP and a human on the CLI can reach different conclusions about the
      same code, the index has two truths and neither is trustworthy. Both adapters call
      query.py and add no logic of their own, so parity is provable rather than hoped for.

  - id: RULE-TI-003
    statement: >
      Every command's JSON=1 output MUST be a single valid JSON object on stdout, with
      nothing else mixed in.
    class: executable
    check: tools/checks/json-output.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#machine-readable-output
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Agents parse this stream. A check that prints a friendly summary without honouring
      JSON mode corrupts it for every consumer while the human output still looks
      perfect — which is exactly how two such bugs reached CI before this rule existed.

  - id: RULE-GOV-001
    statement: >
      The live branch protection MUST match the checked-in desired state in
      ops/github/ruleset.json.
    class: executable
    check: tools/checks/branch-protection.sh
    fixture: >
      manual, against the live GitHub API — see docs/operations.md#governance-drift-evidence.
      Verified 2026-08-04 against three real drift scenarios: enforcement disabled, a rule
      removed, and a bypass actor added. It cannot run in the offline fixture sandbox,
      which is recorded as RISK-GOV-003.
    contract: docs/operations.md#branch-protection
    fix: tools/apply-ruleset.sh
    owner: maintainer
    non_waivable: false
    rationale: >
      A protection that can be switched off in a web UI without leaving a trace is not a
      control. The checked-in file is canonical and drift away from it is detectable.

  - id: RULE-ARCH-001
    statement: >
      A unit dependency that architecture.toml does not allow MUST fail the gate.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The index is descriptive and architecture.toml is normative. An edge that exists
      never legitimises one the contract forbids. This rule is what stops the declared
      structure from becoming a description of the past.

  - id: RULE-ARCH-002
    statement: >
      A new cycle between units MUST fail. Declared cycles are inventoried with an owner
      and a teardown path, under a ratchet that may only shrink.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A cycle is the one structural fact that is never accidental-but-fine: it means two
      units cannot be understood, tested or replaced independently. The ratchet also fails
      when a declared cycle is resolved but left declared, so improvements are locked in
      rather than quietly forgotten.

  - id: RULE-ARCH-003
    statement: "Fan-in MUST NOT exceed the checked-in structural baseline."
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A single high fan-in is never a failure by itself — a shared kernel and a single
      egress point are meant to be depended on. What matters is the value GROWING, which
      is how a module becomes the thing everything needs before anyone decided it should
      be. Raising a baseline is allowed; doing it silently is not.

  - id: RULE-DEP-001
    statement: >
      The backend application MUST import cleanly from its pinned dependency set — the
      service must be able to start.
    class: executable
    check: tools/checks/py-import.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-service-must-be-able-to-start
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      This rule exists because the situation it forbids actually happened. fastapi-mcp
      0.3.3 requires mcp>=1.6.0 with no upper bound; mcp 2.0.0 changed Server.__init__,
      so every image built after that release held a backend that raised TypeError
      before uvicorn bound a port. The image built, the push succeeded, the deploy job
      went green, and the service was down. It is the cheapest possible check that the
      thing being shipped can run at all.

  - id: RULE-SEC-001
    statement: >
      Every HTTP route MUST declare its required guard in rules/route-guards.toml, the
      declaration MUST match the guard the handler enforces, and a route declared open
      MUST record why.
    class: executable
    check: tools/checks/route-guards.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-route-guard-declaration
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A forgotten guard fails silently: the route works, it just works for everybody. That
      is not something a green test suite notices, and it is not something a reviewer
      reliably notices either, because the evidence is one missing parameter default among
      thirty handlers. Declaring the posture as checked-in state turns "did anyone think
      about authorization for this route" into a question the gate answers. Open routes
      carry a reason because a route anyone can reach is a decision, and a decision with no
      recorded reason cannot be told apart from an oversight.

  - id: RULE-DOC-001
    statement: "Every factual claim in AGENTS.md MUST hold against the repository."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A document nobody verifies drifts, and a drifted contract is worse than no contract
      because it is followed. Paths, commands, identifiers and the counted public-surface
      claims are all checked against the actual repository and the index.

  - id: RULE-DOC-002
    statement: "AGENTS.md MUST stay within 250 lines and 12000 bytes."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A contract nobody finishes reading is a contract nobody follows. The budget forces
      detail into linked documents, where it can grow without costing the entry point.

  - id: RULE-DOC-003
    statement: >
      A scoped contract MUST point at the root contract and MUST NOT define rules of its
      own.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped contracts refine local structure; they never weaken a root rule. A rule
      defined in two places is a rule with two meanings, so definition lives only in the
      ledger.

  - id: RULE-DOC-004
    statement: >
      Every reference in an accepted decision record or change brief MUST resolve: each
      cited RULE/RISK/BLIND/WAIVER/CYCLE identifier is declared, each relative link
      resolves, and each ADR referred to in prose exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/change-workflow.md#the-change-impact-brief
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      RULE-DOC-001 keeps the contract honest, but the contract is 168 lines and delegates
      the detail to the records it points at. Those were unchecked, and two had drifted:
      one ADR cited a risk id the ledger does not declare, another named the index
      manifest with the wrong file extension. A dangling reference in a decision record is
      followed exactly as readily as one in the contract, and costs more to discover
      because the reader assumes the record is authoritative. Only references with a
      ground truth to resolve against are checked — see ADR 0016 and RISK-DOC-002 for what
      is deliberately left out. Superseded and rejected records are exempt: they describe
      a world that has moved on, and editing them to keep a gate green falsifies the
      history they exist to preserve.

  - id: RULE-RULE-001
    statement: >
      Every rule in the ledger MUST declare a statement, class, check, contract, owner and
      rationale, and every executable rule MUST name a fixture that exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The ledger is the register of what this repository enforces. An entry missing its
      check or its fixture is a claim of enforcement with nothing behind it.

  - id: RULE-RULE-002
    statement: >
      No waiver may be expired, and each MUST record rule, scope, reason, alternatives,
      risk, mitigation, owner, approver, expiry, re-open trigger and resolution.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A waiver without an expiry is a permanent exception wearing a temporary label. Four
      waivers expire 2026-11-04; when that date passes the gate stops, which is the point.

  - id: RULE-RULE-003
    statement: >
      Every inline suppression MUST correspond to a waiver or a reviewed justified
      suppression.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Suppressing a finding silently is the one thing that turns a gate into theatre. A
      noqa with a waiver id is a decision; a bare noqa is a decision nobody made.

  - id: RULE-FMT-001
    statement: "Backend Python MUST be formatted by `ruff format`."
    class: executable
    check: tools/checks/py-format.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Formatting arguments are a tax on every review. One tool decides, nobody argues,
      and the fix is a single command — so a formatting failure never costs thinking.

  - id: RULE-LINT-001
    statement: "Backend Python MUST pass `ruff check` with the repository's rule selection."
    class: executable
    check: tools/checks/py-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      The selection includes flake8-bandit (S), which is how SEC-1, SEC-3 and the silent
      migration except-clause became visible as gate findings rather than prose in a
      report. Suppressions require an entry in rules/waivers.yaml.

  - id: RULE-LINT-002
    statement: "Frontend JavaScript and Vue MUST pass `eslint`."
    class: executable
    check: tools/checks/js-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to vue/essential — correctness rules only, no template formatting opinions.
      See ADR 0003 for why, and for the trigger to widen it.

  - id: RULE-TYPE-001
    statement: "Backend Python MUST pass `mypy` with the repository's configuration."
    class: executable
    check: tools/checks/py-types.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      `check_untyped_defs` is enabled deliberately: it is what surfaced the unchecked
      `Row | None` indexing in two request handlers (WAIVER-TYPE-001), a class of latent
      500 that no test in this repository would have caught.

  - id: RULE-GATE-002
    statement: >
      Every executable rule MUST have a negative fixture proving that a genuine
      violation makes the gate fail.
    class: executable
    check: tools/checks/gate-conformance.sh
    fixture: tools/fixtures/negative.sh (self-proving — it is the fixture suite)
    contract: docs/task-interface.md#gate-conformance
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A gate component that has never been observed failing is not a rule; it is a shell
      call nobody has tested, and it is worse than nothing because it is believed. This
      rule is why every other rule in this ledger can be trusted.

# Residual risks — properties that matter but cannot currently be made executable.
# Each carries the trigger that should re-open it.
residual_risks:
  - id: RISK-DOC-001
    statement: >
      "Query the index before searching or editing by hand" cannot be mechanically
      enforced — nothing can detect that someone grepped instead. The mitigation is that
      obeying it is faster than not: ./run map and ./run impact answer in under a second
      with evidence classes and blind spots attached.
    owner: maintainer
    re_open_trigger: "a change lands that the index would have flagged, and nobody queried it"
    decision_record: AGENTS.md

  - id: RISK-OPS-002
    statement: >
      The deploy host's compose file is transcribed into docs/operations.md, not checked
      in. The transcription was accurate on 2026-08-24 and nothing detects drift after
      that: an edit on the host silently makes the documented topology wrong, and the
      failure mode is a reader trusting it. Two claims this repository made about
      production were already false when the file was first read — the healthchecks in the
      checked-in compose do not run there, and the rollback runbook's RUNWAY_SHA has
      nothing to substitute into.
    owner: maintainer
    re_open_trigger: "the host's compose file is checked in and compared by the gate, or a documented topology claim is found to be false again"
    decision_record: docs/operations.md

  - id: RISK-DOC-002
    statement: >
      RULE-DOC-004 does not resolve file paths named in the prose of decision records and
      briefs, only identifiers, links and ADR numbers. A record naming a file the way
      prose does can point at the wrong file, or at one that no longer exists, and the
      gate stays green. Two drafts tried to check paths and both produced false positives
      on correct records, because nothing syntactic separates a reference from a mention
      of something that was never built. The mitigation is a convention rather than a
      control: records point at files with links, which are checked. Anchor targets within
      those links are likewise unverified.
    owner: maintainer
    re_open_trigger: "a record's prose filename is found to point at the wrong file, a renamed section leaves a link resolving to the wrong place, or a reliable signal is found that separates a reference from a mention"
    decision_record: docs/adr/0016-briefs-are-generated-references-are-checked.md

  - id: RISK-IDX-001
    statement: >
      The MCP adapter speaks JSON-RPC as specified and is tested at the protocol level,
      but has not been exercised against a real MCP client from this environment. The CLI
      is the path with no such caveat.
    owner: maintainer
    re_open_trigger: "someone connects a real MCP client, or a client reports a protocol error"
    decision_record: docs/adr/0008-index-implementation-mode.md

  - id: RISK-TEST-004
    statement: >
      Frontend rendering, routing, keyboard handling, swipe gestures and dark mode are
      covered by no test. The suite deliberately covers pure logic only.
    owner: maintainer
    re_open_trigger: "a defect that only manifests in a mounted component or across the SPA/API boundary"
    decision_record: docs/adr/0007-frontend-test-scope.md

  - id: RISK-DEP-001
    statement: >
      The backend images install Taskwarrior with `pacman -Sy task` from `archlinux:latest`.
      Neither is pinned, so every build takes whatever Arch ships that day and the binary
      can change under a commit that touches nothing. It already has: Taskwarrior 3.5.0
      began requiring theme files the images were not copying, and every container test
      failed on an unchanged backend. Pinning the base image by digest would not fix it —
      pacman resolves against live repositories at build time — and pinning the package
      version makes the build fail once Arch drops it, which is weeks. Step 14 owns the
      real answer: a pinned artefact this repository controls rather than a rolling distro.
    owner: maintainer
    re_open_trigger: "the container tier breaks again on an unchanged backend, or Step 14 replaces the Arch source"
    decision_record: docs/operations.md#incident-2026-08-25

  - id: RISK-SEC-001
    statement: >
      The frontend's role check is cosmetic. `auth.role` in the Vue store is read from
      localStorage, so a viewer can make the admin UI render for themselves. Every /admin
      route is guarded server-side, so the result is a screen full of 403s rather than
      access — a display bug, not a privilege escalation. Making it honest means deriving
      the role from a server response on every mount rather than from client storage.
    owner: maintainer
    re_open_trigger: "any admin-only behaviour is implemented in the frontend without a server-side guard behind it"
    decision_record: docs/security.md

  - id: RISK-SEC-002
    statement: >
      The users.role column is TEXT DEFAULT 'user' with no database-level constraint, so a
      value written outside the application — by hand on the host, or by a future migration
      — is not rejected. Every in-application writer validates against VALID_ROLES, and an
      unrecognised value is not equal to 'admin', so the failure is closed rather than open.
      A CHECK constraint would need a table rebuild, and migrations currently swallow every
      exception (WAIVER-OPS-001), which makes a silent half-applied rebuild the more likely
      failure of the two.
    owner: maintainer
    re_open_trigger: "WAIVER-OPS-001 is resolved and migrations report their failures, or a third role is introduced"
    decision_record: docs/security.md

  - id: RISK-TEST-001
    statement: >
      The container test tier cannot run on arm64: archlinux publishes no arm64 image and
      pacman fails under amd64 emulation. An Apple Silicon developer never exercises the
      real Taskwarrior binary locally and sees that tier only in CI.
    owner: maintainer
    re_open_trigger: "a second developer joins on arm64, or CI stops running x86_64"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-002
    statement: >
      RULE-TEST-002 has no automated negative fixture. The offline fixture sandbox has
      neither Docker nor an x86_64 host, so the container tier cannot be made to fail
      there on demand.
    owner: maintainer
    re_open_trigger: "Step 9's ledger validator requires an automated fixture for every executable rule"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-003
    statement: >
      The suite runs bcrypt at its minimum cost factor so the gate stays inside its
      runtime budget. The production cost factor is therefore covered by no test.
    owner: maintainer
    re_open_trigger: "the password hashing scheme or its parameters change"
    decision_record: backend/tests/conftest.py

  - id: RISK-GOV-001
    statement: >
      Required-reviewer enforcement is impossible with a single maintainer: the only
      person who can approve a change is the person who wrote it. No control in this
      repository provides independent review of a change to the rules themselves.
    owner: maintainer
    re_open_trigger: "a second contributor gains write access to the repository"
    decision_record: docs/plan/phase-0-2.md F4

  - id: RISK-GOV-002
    statement: >
      tools/checks/branch-protection.sh needs network and an authenticated gh. Where it
      cannot reach GitHub it reports that and does not fail, so a run on an offline
      machine proves nothing about the live governance state.
    owner: maintainer
    re_open_trigger: "the scheduled decay review (Step 16c) begins carrying this evidence"
    decision_record: docs/adr/0005-gate-the-deploy.md

  - id: RISK-GOV-003
    statement: >
      RULE-GOV-001 has no automated negative fixture. Its violations were constructed and
      observed by hand against the live API because the offline fixture sandbox has no
      GitHub to drift from.
    owner: maintainer
    re_open_trigger: "Step 9's ledger validator requires an automated fixture for every executable rule"
    decision_record: docs/operations.md

  - id: RISK-BOOTSTRAP-001
    statement: >
      The non-uv bootstrap path (python3 -m venv against a system interpreter) is not
      exercised by CI; only `make doctor`'s warning covers it.
    owner: maintainer
    re_open_trigger: "a contributor reports a bootstrap failure, or a second CI runner image is added"
    decision_record: docs/adr/0002-python-interpreter-provisioning.md

  - id: RISK-OPS-001
    statement: >
      `platforms: linux/amd64` in deploy.yml is a declaration, not an enforced invariant.
      Nothing in the gate inspects the architecture of a pushed image, so an edit that
      removes the pin would publish an image matching whatever runner built it, and the
      failure would surface only as `exec format error` on the production host after the
      deploy had already replaced the running container.
    owner: maintainer
    re_open_trigger: "a second deployment target on a different architecture, or a build that runs anywhere other than a hosted x86_64 runner"
    decision_record: docs/adr/0015-pin-the-build-platform.md
