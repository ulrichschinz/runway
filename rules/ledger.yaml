# Runway Rule Ledger — every normative rule in this repository, with its evidence.
#
# Only MUST / MUST NOT / REQUIRED / FORBIDDEN statements get an id. Advice does not.
# Each rule declares how it is enforced:
#
#   executable         a check that fails the gate  (documentation alone is not enforcement)
#   observable         measured and reported, but not blocking
#   human_judgment     cannot be mechanically checked; a named review criterion
#   waiver             a temporary, expiring exception — see rules/waivers.yaml
#
# Every executable rule keeps a negative fixture proving that a genuine violation makes
# the gate fail. A rule whose fixture is missing is not yet proven to work — correct
# execution is not evidence that a gate works.
#
# THE META-RULE: changing any rule means changing the contract, the executable check or
# this ledger entry, and a dated decision record — atomically, in the same commit.
#
# Every rule below has been adversarially verified by tools/fixtures/negative.sh: the
# violation was constructed and the gate observed going red. Step 2 wires that script
# into the verify profile so the proof runs on every gate execution rather than by hand.
# Step 9 adds the validator that enforces this file's own shape.

version: 1

rules:
  - id: RULE-HYG-001
    statement: "Secret-bearing and generated paths MUST NOT be tracked in git."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      .env, users.db and data/ are bind-mounted from the production host. This is a
      public repository, so tracking any of them publishes live credentials and user
      data irreversibly.

  - id: RULE-HYG-002
    statement: ".gitignore MUST cover every secret-bearing and generated path."
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#repository-hygiene
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      RULE-HYG-001 catches a leak that already happened. This one keeps it from being
      possible in the first place.

  - id: RULE-HYG-003
    statement: >
      A checked-in deployment compose file MUST reference every secret as ${VAR}, never
      carry a literal value.
    class: executable
    check: tools/checks/repo-hygiene.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#the-deploy-hosts-topology
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      ops/deploy/docker-compose.yml is checked in so the production topology is reviewable
      and diffable, which is only safe while the secrets in it are references resolved from
      a .env that stays on the host. A literal would publish a live credential to a public
      repository, and in a diff it looks almost exactly like the reference it replaced —
      one interpolation removed. RULE-HYG-001 catches a secret-bearing file; this catches a
      secret smuggled into a file that is supposed to be there.

  - id: RULE-TI-001
    statement: >
      Every task-interface command MUST be documented in docs/task-interface.md, and
      every documented command MUST exist and delegate to an executable script.
    class: executable
    check: tools/checks/task-interface.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#commands
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The task interface is the first thing a cold agent reads. An undocumented command
      is invisible to it; a documented but missing command sends it down a dead end.

  - id: RULE-TI-002
    statement: >
      The runtime versions declared in tools/versions.env MUST match the versions the
      Dockerfiles build on.
    class: executable
    check: tools/checks/toolchain-pinning.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#toolchain
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      versions.env is what bootstrap provisions against. Disagreement means every local
      environment is quietly wrong about what production runs.

  - id: RULE-GATE-001
    statement: "A verification profile MUST complete inside its declared runtime budget."
    class: executable
    check: tools/run-profile.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#runtime-budgets
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A slow gate gets bypassed, which is worse than no gate: it teaches contributors
      that green is optional. Budgets live in tools/checks/budgets.conf.

  - id: RULE-TEST-001
    statement: "The backend unit test suite MUST pass."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Until 2026-08-04 this repository had no test of any kind. The unit tier fakes
      Taskwarrior at the task_runner._run seam, so everything above it — argv
      construction, validation, routing, error mapping — executes for real without
      needing the binary, Docker or a network.

  - id: RULE-TEST-002
    statement: >
      The backend suite MUST pass against the real Taskwarrior binary, including the
      cross-tenant isolation tests.
    class: executable
    check: tools/checks/py-test-container.sh
    fixture: >
      no automated fixture — the tier needs Docker and an x86_64 host, neither of which
      the offline sandbox has. Recorded as RISK-TEST-002.
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The only boundary between two users' tasks is three environment variables handed to
      a subprocess. There is no ownership column and no second gate. That property cannot
      be tested against a fake, because the fake is the thing that would have to enforce it.

  - id: RULE-TEST-003
    statement: "Backend line coverage MUST NOT fall below the checked-in floor."
    class: executable
    check: tools/checks/py-test-unit.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A ratchet, not a target. The floor sits below the current figure on purpose: one
      that tracks the exact number turns every unrelated refactor into a coverage failure,
      and a gate that fails for irrelevant reasons is a gate people learn to bypass.

  - id: RULE-TEST-004
    statement: "The frontend logic test suite MUST pass."
    class: executable
    check: tools/checks/js-test.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#tests
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to pure logic modules. The frontend defects this repository has actually
      shipped — c6ce0f2 and 472b673, both context-tag comma-splitting — were in pure
      functions, not in component rendering. Testing where the bugs were beats testing
      where tests are conventional.

  - id: RULE-IDX-001
    statement: "The index MUST be current with the working tree."
    class: executable
    check: tools/checks/index-fresh.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: make fix   (or make index)
    owner: maintainer
    non_waivable: false
    rationale: >
      A stale index is worse than no index: it answers confidently and wrongly. Exit 4 is
      reserved for it — the answer would have been unreliable, so no answer is given.

  - id: RULE-IDX-002
    statement: >
      Rebuilding the index from unchanged sources MUST produce a byte-identical export.
    class: executable
    check: tools/checks/index-deterministic.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      ADR 0008 removed the incremental build path so that "incremental and clean rebuilds
      are equivalent" holds by construction. This keeps that claim honest: unordered
      iteration or a timestamp would break it silently, and a graph that changes without
      its sources changing cannot be trusted to say anything.

  - id: RULE-IDX-003
    statement: "The index MUST pass its qualification suite."
    class: executable
    check: tools/checks/index-qualified.sh
    fixture: tools/fixtures/negative.sh
    contract: index/schema.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Installation is not proof of compliance. A qualification failure means the index is
      lying — asserting relationships that are wrong, or dressing a declaration up as a
      parsed fact — which is worse than having no index, because the answers are believed.

  - id: RULE-IDX-004
    statement: "The CLI and MCP adapters MUST return the same facts."
    class: executable
    check: tools/checks/index-parity.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-index
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Two access paths over one query layer is only worth having if they cannot disagree.
      If an agent on MCP and a human on the CLI can reach different conclusions about the
      same code, the index has two truths and neither is trustworthy. Both adapters call
      query.py and add no logic of their own, so parity is provable rather than hoped for.

  - id: RULE-TI-003
    statement: >
      Every command's JSON=1 output MUST be a single valid JSON object on stdout, with
      nothing else mixed in.
    class: executable
    check: tools/checks/json-output.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#machine-readable-output
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Agents parse this stream. A check that prints a friendly summary without honouring
      JSON mode corrupts it for every consumer while the human output still looks
      perfect — which is exactly how two such bugs reached CI before this rule existed.

  - id: RULE-GOV-001
    statement: >
      The live branch protection MUST match the checked-in desired state in
      ops/github/ruleset.json.
    class: executable
    check: tools/checks/branch-protection.sh
    fixture: >
      manual, against the live GitHub API — see docs/operations.md#governance-drift-evidence.
      Verified 2026-08-04 against three real drift scenarios: enforcement disabled, a rule
      removed, and a bypass actor added. It cannot run in the offline fixture sandbox,
      which is recorded as RISK-GOV-003.
    contract: docs/operations.md#branch-protection
    fix: tools/apply-ruleset.sh
    owner: maintainer
    non_waivable: false
    rationale: >
      A protection that can be switched off in a web UI without leaving a trace is not a
      control. The checked-in file is canonical and drift away from it is detectable.

  - id: RULE-ARCH-001
    statement: >
      A unit dependency that architecture.toml does not allow MUST fail the gate.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      The index is descriptive and architecture.toml is normative. An edge that exists
      never legitimises one the contract forbids. This rule is what stops the declared
      structure from becoming a description of the past.

  - id: RULE-ARCH-002
    statement: >
      A new cycle between units MUST fail. Declared cycles are inventoried with an owner
      and a teardown path, under a ratchet that may only shrink.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A cycle is the one structural fact that is never accidental-but-fine: it means two
      units cannot be understood, tested or replaced independently. The ratchet also fails
      when a declared cycle is resolved but left declared, so improvements are locked in
      rather than quietly forgotten.

  - id: RULE-ARCH-003
    statement: "Fan-in MUST NOT exceed the checked-in structural baseline."
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#boundaries
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A single high fan-in is never a failure by itself — a shared kernel and a single
      egress point are meant to be depended on. What matters is the value GROWING, which
      is how a module becomes the thing everything needs before anyone decided it should
      be. Raising a baseline is allowed; doing it silently is not.

  - id: RULE-DEP-001
    statement: >
      The backend application MUST import cleanly from its pinned dependency set — the
      service must be able to start.
    class: executable
    check: tools/checks/py-import.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#the-service-must-be-able-to-start
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      This rule exists because the situation it forbids actually happened. fastapi-mcp
      0.3.3 requires mcp>=1.6.0 with no upper bound; mcp 2.0.0 changed Server.__init__,
      so every image built after that release held a backend that raised TypeError
      before uvicorn bound a port. The image built, the push succeeded, the deploy job
      went green, and the service was down. It is the cheapest possible check that the
      thing being shipped can run at all.

  - id: RULE-SEC-001
    statement: >
      Every HTTP route MUST declare its required guard in rules/route-guards.toml, the
      declaration MUST match the guard the handler enforces, and a route declared open
      MUST record why.
    class: executable
    check: tools/checks/route-guards.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-route-guard-declaration
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A forgotten guard fails silently: the route works, it just works for everybody. That
      is not something a green test suite notices, and it is not something a reviewer
      reliably notices either, because the evidence is one missing parameter default among
      thirty handlers. Declaring the posture as checked-in state turns "did anyone think
      about authorization for this route" into a question the gate answers. Open routes
      carry a reason because a route anyone can reach is a decision, and a decision with no
      recorded reason cannot be told apart from an oversight.

  - id: RULE-SEC-002
    statement: >
      Every compatibility shim MUST be recorded in rules/shims.yaml with what, why, a
      removal step, evidence, an owner and an expiry, and no shim may be past its expiry.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/change-workflow.md#public-surface-or-data-migration
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Expand → migrate → switch → contract only works if the contract step happens, and it
      is the step that gets skipped: the old shape keeps working, nothing fails, and
      "temporary" becomes permanent by default rather than by decision. The countdown has
      to be enforced by something that goes red, exactly as RULE-RULE-002 does for waivers.
      A date nothing checks is a wish.

  - id: RULE-ARCH-004
    statement: >
      A standard-library module listed in architecture.toml's restricted_imports MUST NOT be
      imported anywhere inside its declared scope except the files that declaration allows.
    class: executable
    check: tools/checks/boundaries.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md#the-taskwarrior-boundary
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      task_runner is the single place this application invokes the Taskwarrior binary, and
      that is the only reason its argv hardening is a control rather than a convention
      (finding SEC-3). A second module importing subprocess would bypass the `--` separator
      and the override refusal with nothing going red — an easy change to make by accident
      while chasing something else. A choke point only works while it stays the only door,
      and "stays" is a property that needs enforcing rather than intending.

  - id: RULE-SURF-001
    statement: >
      Every protected public surface — the served OpenAPI schema, the runtime MCP tool list,
      the migrated database schema, the Taskwarrior template, and the SPA routes and
      localStorage keys — MUST match its snapshot in ops/surfaces/.
    class: executable
    check: tools/checks/surfaces.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: ./run surfaces --update
    owner: maintainer
    non_waivable: false
    rationale: >
      These are treated as externally consumed, and the failure mode is silence: renaming a
      route handler function renames its MCP tool, which breaks every client, and the diff
      shows only a Python rename. The snapshot does not prevent the change — it makes the
      change appear in a file a human has to commit. Runtime observation rather than
      declaration is the point: the contract claimed for months that MCP tool names were
      handler function names, and booting the app showed they are operation ids. Zero of the
      seven tool names the README documented existed.

  - id: RULE-SURF-002
    statement: >
      Every environment variable the application reads MUST be documented in README.md, and
      every variable documented there MUST be read by the application.
    class: executable
    check: tools/checks/surfaces.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Both directions are failures with the same shape — a configuration surface that lies.
      A documented variable nothing reads gives an operator silence instead of an effect;
      README documented PORT that way, and this check is what finally caught it. An
      undocumented variable the app does read is a knob nobody can find, which is how
      CORS_ORIGINS, BOOTSTRAP_ADMIN and the rate-limit settings all shipped.

  - id: RULE-DEP-002
    statement: >
      Every dependency's licence MUST be classified by policy/licenses.yaml, and MUST NOT be
      forbidden, unclassified, absent, or an unapproved review case.
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: policy/licenses.yaml
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      This repository publishes container images publicly, so a dependency's licence is an
      obligation passed on to whoever redeploys them. Strong copyleft would carry source
      obligations onto them, which this project does not ask. Unknown fails closed on purpose:
      a dependency whose licence nobody could determine is not one whose licence is fine, it
      is one nobody has looked at. The escape hatch costs a minute of reading rather than a
      suppression.

  - id: RULE-DEP-003
    statement: "No credential may be committed to this repository."
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/security.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      RULE-HYG-001 keeps secret-bearing paths out of git and RULE-HYG-003 keeps literals out
      of the deployment compose. Neither catches the ordinary case: a key pasted into a source
      file, a fixture or a documentation example, in a file that belongs here. This repository
      is public, so a committed credential is disclosed the moment it is pushed and rotation
      is the only remedy — the cheapest moment to catch it is before the push.

  - id: RULE-DEP-004
    statement: >
      Every base image MUST be pinned by digest, Arch packages MUST come from a dated archive
      snapshot rather than live mirrors, and Python dependencies MUST install from a
      hash-pinned lock with --require-hashes.
    class: executable
    check: tools/checks/supply-chain.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md
    fix: ./run lock
    owner: maintainer
    non_waivable: false
    rationale: >
      A floating tag means what ships is a function of the calendar rather than of the commit.
      This repository has been bitten twice: mcp 2.0.0 shipped a backend that could not start
      through a green deploy on 2026-08-04, and Taskwarrior rolled forward under
      archlinux:latest on 2026-08-25 and broke every container test on an unchanged backend.
      The archive snapshot is checked separately from the digest because a digest does not pin
      what pacman installs — pacman resolves against live mirrors at build time, so without it
      the binary version is still whatever Arch published that day.

  - id: RULE-DOC-001
    statement: "Every factual claim in AGENTS.md MUST hold against the repository."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A document nobody verifies drifts, and a drifted contract is worse than no contract
      because it is followed. Paths, commands, identifiers and the counted public-surface
      claims are all checked against the actual repository and the index.

  - id: RULE-DOC-002
    statement: "AGENTS.md MUST stay within 250 lines and 12000 bytes."
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A contract nobody finishes reading is a contract nobody follows. The budget forces
      detail into linked documents, where it can grow without costing the entry point.

  - id: RULE-DOC-003
    statement: >
      A scoped contract MUST point at the root contract and MUST NOT define rules of its
      own.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped contracts refine local structure; they never weaken a root rule. A rule
      defined in two places is a rule with two meanings, so definition lives only in the
      ledger.

  - id: RULE-DOC-004
    statement: >
      Every reference in an accepted decision record or change brief MUST resolve: each
      cited RULE/RISK/BLIND/WAIVER/CYCLE identifier is declared, each relative link
      resolves, and each ADR referred to in prose exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/change-workflow.md#the-change-impact-brief
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      RULE-DOC-001 keeps the contract honest, but the contract is 168 lines and delegates
      the detail to the records it points at. Those were unchecked, and two had drifted:
      one ADR cited a risk id the ledger does not declare, another named the index
      manifest with the wrong file extension. A dangling reference in a decision record is
      followed exactly as readily as one in the contract, and costs more to discover
      because the reader assumes the record is authoritative. Only references with a
      ground truth to resolve against are checked — see ADR 0016 and RISK-DOC-002 for what
      is deliberately left out. Superseded and rejected records are exempt: they describe
      a world that has moved on, and editing them to keep a gate green falsifies the
      history they exist to preserve.

  - id: RULE-RULE-001
    statement: >
      Every rule in the ledger MUST declare a statement, class, check, contract, owner and
      rationale, and every executable rule MUST name a fixture that exists.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      The ledger is the register of what this repository enforces. An entry missing its
      check or its fixture is a claim of enforcement with nothing behind it.

  - id: RULE-RULE-002
    statement: >
      No waiver may be expired, and each MUST record rule, scope, reason, alternatives,
      risk, mitigation, owner, approver, expiry, re-open trigger and resolution.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A waiver without an expiry is a permanent exception wearing a temporary label. Four
      waivers expire 2026-11-04; when that date passes the gate stops, which is the point.

  - id: RULE-RULE-003
    statement: >
      Every inline suppression MUST correspond to a waiver or a reviewed justified
      suppression.
    class: executable
    check: tools/checks/contract.sh
    fixture: tools/fixtures/negative.sh
    contract: AGENTS.md
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      Suppressing a finding silently is the one thing that turns a gate into theatre. A
      noqa with a waiver id is a decision; a bare noqa is a decision nobody made.

  - id: RULE-FMT-001
    statement: "Backend Python MUST be formatted by `ruff format`."
    class: executable
    check: tools/checks/py-format.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Formatting arguments are a tax on every review. One tool decides, nobody argues,
      and the fix is a single command — so a formatting failure never costs thinking.

  - id: RULE-LINT-001
    statement: "Backend Python MUST pass `ruff check` with the repository's rule selection."
    class: executable
    check: tools/checks/py-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      The selection includes flake8-bandit (S), which is how SEC-1, SEC-3 and the silent
      migration except-clause became visible as gate findings rather than prose in a
      report. Suppressions require an entry in rules/waivers.yaml.

  - id: RULE-LINT-002
    statement: "Frontend JavaScript and Vue MUST pass `eslint`."
    class: executable
    check: tools/checks/js-lint.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: make fix
    owner: maintainer
    non_waivable: false
    rationale: >
      Scoped to vue/essential — correctness rules only, no template formatting opinions.
      See ADR 0003 for why, and for the trigger to widen it.

  - id: RULE-TYPE-001
    statement: "Backend Python MUST pass `mypy` with the repository's configuration."
    class: executable
    check: tools/checks/py-types.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/task-interface.md#formatting-linting-and-types
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      `check_untyped_defs` is enabled deliberately: it is what surfaced the unchecked
      `Row | None` indexing in two request handlers (WAIVER-TYPE-001), a class of latent
      500 that no test in this repository would have caught.

  - id: RULE-GATE-002
    statement: >
      Every executable rule MUST have a negative fixture proving that a genuine
      violation makes the gate fail.
    class: executable
    check: tools/checks/gate-conformance.sh
    fixture: tools/fixtures/negative.sh (self-proving — it is the fixture suite)
    contract: docs/task-interface.md#gate-conformance
    fix: none
    owner: maintainer
    non_waivable: true
    rationale: >
      A gate component that has never been observed failing is not a rule; it is a shell
      call nobody has tested, and it is worse than nothing because it is believed. This
      rule is why every other rule in this ledger can be trusted.

  - id: RULE-OPS-001
    statement: >
      Every blocking outward call the serving application makes — process execution and
      network egress — MUST declare a timeout at the call site.
    class: executable
    check: tools/checks/timeouts.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#timeouts
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A call with no timeout does not fail, it waits, and the worker serving the request
      waits with it. There is one Taskwarrior binary behind every list this application
      renders, so a `task` invocation that never returns is not a slow page — it is a worker
      that never comes back, and enough of them is an outage with nothing in any log to
      explain it. The application makes exactly one such call today and it already declares
      `timeout=10`; the rule costs nothing now and exists so that stays true when the second
      one is added, most likely by someone who never read this file. Scoped to backend/app/
      because repository tooling already runs inside the gate's own runtime budget
      (RULE-GATE-001). It checks declaration, not sufficiency — see RISK-OPS-003.

  - id: RULE-OPS-002
    statement: >
      No credential may reach a log line: the serving application MUST NOT pass a
      credential-bearing expression — a secret, password or password hash, token, API key or
      bearer credential — to a logging call, in the message, in an interpolation, or in the
      structured fields.
    class: executable
    check: tools/checks/log-secrets.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#no-secrets-in-logs
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      A credential in the database is a credential under a control; the same credential in a
      log line is one in a file, a backup and someone's scrollback, kept for as long as the
      retention policy says. Nothing raises and nothing errors, so the disclosure is invisible
      until somebody reads the file — and by then rotation, not deletion, is the only remedy,
      exactly as for RULE-DEP-003. The application has no logging at all today, so the property
      holds for free and stops holding in the first commit that adds a logger; the rule lands
      before the logging module rather than after it, because the reviewer who would catch
      logger.info(f"login {body.password}") is the same reviewer reading a hundred new lines of
      logging plumbing. Scoped to backend/app/, the only code whose output reaches a production
      log. The check reads source, not emitted output, so it holds whichever transport Step 15a
      settles on. It matches credential-bearing names, so it cannot see a credential arriving
      under a neutral name — see RISK-OPS-004.

  - id: RULE-OPS-003
    statement: >
      The deploy compose file MUST NOT ask the host for privilege, for its network namespace,
      or for a bind mount whose source lies outside the service directory.
    class: executable
    check: tools/checks/deploy-compose.sh
    fixture: tools/fixtures/negative.sh
    contract: docs/operations.md#the-deploy-mechanism
    fix: none
    owner: maintainer
    non_waivable: false
    rationale: >
      Until 2026-08-28 the deploy key could only pull images and restart; the compose file was
      maintained by hand on the host and ops/deploy/docker-compose.yml was a transcription of
      it. A transcription is accurate on the day it is taken, and three claims this repository
      made about production were each true when written and each drifted silently afterwards —
      every one of them found by reading the host rather than by anything failing. So the
      compose file became part of the deployed artefact, which removes the drift and widens what
      a merge to main can reach: compose can mount host paths, join the host network namespace
      and ask for privilege, none of which application code can do from inside a container. This
      rule is the boundary on that widening. It does not sandbox the deployment and does not
      pretend to — whoever can merge can still change what the services run. It refuses the
      specific edits that turn a container-scoped change into a host-scoped one, in a file that
      is easy to skim past in review because it is mostly YAML nobody reads twice.

# Residual risks — properties that matter but cannot currently be made executable.
# Each carries the trigger that should re-open it.
residual_risks:
  - id: RISK-DOC-001
    statement: >
      "Query the index before searching or editing by hand" cannot be mechanically
      enforced — nothing can detect that someone grepped instead. The mitigation is that
      obeying it is faster than not: ./run map and ./run impact answer in under a second
      with evidence classes and blind spots attached.
    owner: maintainer
    re_open_trigger: "a change lands that the index would have flagged, and nobody queried it"
    decision_record: AGENTS.md

  - id: RISK-OPS-003
    statement: >
      RULE-OPS-001 checks that a timeout is declared, not that it is sensible. A call
      written with timeout=86400 satisfies the rule and helps nobody; so does one whose
      timeout is longer than the reverse proxy's own read timeout, which turns a bounded
      wait into a 504 with a worker still blocked behind it. Declaration is mechanically
      checkable and sufficiency is not — the right value depends on what the callee does,
      what the caller promised, and what sits in front of both. The check also knows only
      the process and HTTP-client shapes it lists: a blocking call through a library it has
      not been taught is invisible to it.
    owner: maintainer
    re_open_trigger: "a second egress client is introduced, a timeout is observed firing in production, or a reverse-proxy read timeout is set below an application timeout"
    decision_record: docs/adr/0022-timeouts-are-declared.md

  - id: RISK-OPS-004
    statement: >
      RULE-OPS-002 is a name-based static scan, and it is bounded on both sides in the same
      way RISK-DEP-002 records for secret_scan.py. It sees a credential that is *called* one —
      body.password, settings.jwt_secret, x_api_key, credentials.credentials, new_key — and it
      is blind to the same value under a neutral name: logging `body`, `row`, `value` or a
      request object discloses the password with nothing to match on, and so does a credential
      assembled at runtime or returned by a function whose name does not say so. It reads only
      backend/app/, so a credential logged by a library, by uvicorn's own access logger, or by
      an exception traceback that happens to carry one is outside it entirely. And it recognises
      loggers by import, by assignment from getLogger, and by a receiver named like a logger:
      a logger reached some other way is a hole. The per-line `log-secrets: allow` marker is
      deliberately greppable so the standing exemptions stay reviewable.
    owner: maintainer
    re_open_trigger: "a credential is found in a production log that the scan did not report, an exemption marker is used more than twice, or a logging library is introduced that this scan does not recognise"
    decision_record: docs/adr/0023-no-secrets-in-logs.md

  - id: RISK-OPS-005
    statement: >
      The runtime redaction filter in backend/app/logging_setup.py is the second half of a
      two-part control and it is bounded in the mirror image of the first. It removes a value
      by the field name it arrives under, and by the shapes it has been taught — a JWT, a
      bcrypt hash, the 43-character token_urlsafe(32) an API key is, and the resolved
      JWT_SECRET matched literally. It is therefore blind to a credential that has neither: a
      user's password is an arbitrary string under an arbitrary name, so `logger.info("got",
      extra={"detail": password})` survives the filter and is caught only by RULE-OPS-002 at
      the call site — and only while the name says what it is. A credential minted by some
      future scheme with a different shape is invisible until the shape is added here. The
      api-key shape is also a false-positive risk in the other direction: any unbroken
      43-character run of the URL-safe alphabet is redacted, which costs a log line its
      usefulness rather than costing a disclosure, and that is the trade this takes
      deliberately. Finally, the filter covers only what passes through this process's
      handler: anything written before configure_logging runs, or by a sidecar, is outside it.
    owner: maintainer
    re_open_trigger: "a credential is found in a log line that both RULE-OPS-002 and the filter passed, a new credential format is introduced, or the api-key shape is observed redacting something an operator needed"
    decision_record: docs/adr/0024-structured-logging.md

  - id: RISK-SURF-001
    statement: >
      A fresh database and a migrated one do not have the same schema, and the snapshot that
      is supposed to be the truth about the schema only ever describes the fresh one.
      CREATE_USERS declares `api_key TEXT UNIQUE`; the migration that back-fills that column
      into an existing database declares plain `TEXT`, because SQLite cannot add a UNIQUE
      column by ALTER TABLE at all. So an instance created after the column existed enforces
      uniqueness and an instance migrated into it does not — and production is the second
      kind. tools/surfaces.py captures the schema by running init_db() against an empty
      temporary file, which is the fresh path, so ops/surfaces/db-schema.sql records the
      UNIQUE constraint that production does not have. RULE-SURF-001 compares that snapshot
      against itself and passes: the mechanism cannot see this class of drift, because both
      sides of the comparison are generated the same way. The practical exposure is small —
      api_key is secrets.token_urlsafe(32), so a collision is not a real event — but the
      snapshot is relied on as a description of production and on this point it is wrong.
    owner: maintainer
    re_open_trigger: "a migrations/ directory with a version table exists, or a second column diverges between the created and migrated schemas, or a uniqueness assumption is written against api_key"
    decision_record: docs/adr/0025-narrowing-the-migration-except.md

  - id: RISK-OPS-002
    statement: >
      The deploy host's compose file is checked in as ops/deploy/docker-compose.yml, but
      nothing compares it against the host. It matched on 2026-08-24; after that an edit on
      either side silently makes the other wrong, and the failure mode is a reader trusting
      the copy. A gate check cannot close this — CI has no access to the deploy host — so
      it needs a scheduled job running somewhere that does. Two claims this repository made
      about production were already false when the file was first read: the healthchecks
      did not run there, and the rollback runbook's RUNWAY_SHA had nothing to substitute
      into. Both are fixed in the checked-in copy.
    owner: maintainer
    re_open_trigger: "a job exists that compares the checked-in copy against the host, or a documented topology claim is found to be false again"
    decision_record: docs/operations.md

  - id: RISK-DOC-002
    statement: >
      RULE-DOC-004 does not resolve file paths named in the prose of decision records and
      briefs, only identifiers, links and ADR numbers. A record naming a file the way
      prose does can point at the wrong file, or at one that no longer exists, and the
      gate stays green. Two drafts tried to check paths and both produced false positives
      on correct records, because nothing syntactic separates a reference from a mention
      of something that was never built. The mitigation is a convention rather than a
      control: records point at files with links, which are checked. Anchor targets within
      those links are likewise unverified.
    owner: maintainer
    re_open_trigger: "a record's prose filename is found to point at the wrong file, a renamed section leaves a link resolving to the wrong place, or a reliable signal is found that separates a reference from a mention"
    decision_record: docs/adr/0016-briefs-are-generated-references-are-checked.md

  - id: RISK-IDX-001
    statement: >
      The MCP adapter speaks JSON-RPC as specified and is tested at the protocol level,
      but has not been exercised against a real MCP client from this environment. The CLI
      is the path with no such caveat.
    owner: maintainer
    re_open_trigger: "someone connects a real MCP client, or a client reports a protocol error"
    decision_record: docs/adr/0008-index-implementation-mode.md

  - id: RISK-TEST-004
    statement: >
      Frontend rendering, routing, keyboard handling, swipe gestures and dark mode are
      covered by no test. The suite deliberately covers pure logic only.
    owner: maintainer
    re_open_trigger: "a defect that only manifests in a mounted component or across the SPA/API boundary"
    decision_record: docs/adr/0007-frontend-test-scope.md

  - id: RISK-DEP-001
    statement: >
      RESOLVED 2026-08-26 by Step 14. The base image is digest-pinned and the package
      repository is pinned to the Arch Linux Archive snapshot of 2026-08-25, so `task` is
      reproducible at 3.5.0. What remains is the cost of that choice: the archive snapshot is
      a date someone must move deliberately, and a snapshot left alone for a year silently
      accumulates unpatched packages. Dependabot does not watch it — nothing announces that a
      pinned archive date has aged.
    owner: maintainer
    re_open_trigger: "the archive snapshot date is more than six months old, or archive.archlinux.org stops serving the pinned date"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-DEP-003
    statement: >
      passlib 1.7.4 is the LATEST release and it is from 2020-10-08 — unmaintained rather than
      merely pinned. It is the only thing hashing and verifying passwords here. bcrypt is held
      at 4.0.1 because passlib reads an attribute bcrypt removed: bcrypt 5.0.0 does not warn,
      it fails every hash with "password cannot be longer than 72 bytes" (tested 2026-08-26).
      So the security-relevant dependency is frozen by a dead one, and Dependabot will keep
      offering the bump that breaks every login. Replacing passlib means re-verifying stored
      hashes against a different implementation, which is its own change with its own
      migration evidence.
    owner: maintainer
    re_open_trigger: "a passlib advisory is published, or the bcrypt pin blocks a fix, or a password-hashing migration is scheduled"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-DEP-002
    statement: >
      Secret scanning is pattern-based. It catches provider-issued credentials by their
      prefixes and high-entropy assignments to credential-shaped names; it will miss a secret
      that looks like ordinary prose, one split across lines, or one encoded. It also only
      reads the current tree — a credential committed and later deleted stays in history and
      stays disclosed. Rotation, not deletion, remains the remedy.
    owner: maintainer
    re_open_trigger: "a credential is found in this repository that the scanner did not report, or history rewriting is ever considered as a remedy"
    decision_record: docs/adr/0021-supply-chain-pinning.md

  - id: RISK-SEC-003
    statement: >
      Login rate limiting is in-process and per-worker: the counters live in a module dict,
      reset on restart, and are not shared between processes. Under one host and one worker
      (decision F1) that is the whole population, so the limit is real; add a second worker
      or a second host and the effective limit multiplies by the process count. Keying on
      username rather than IP is also a deliberate trade: an attacker who knows a username
      can deny it password login for the window. API keys are checked before any password
      path, so agents, MCP clients and the webhook keep working through a lockout.
    owner: maintainer
    re_open_trigger: "a second worker or host is introduced, or an account lockout is used against a real user"
    decision_record: docs/adr/0018-cors-startup-refusal-and-the-inbox-shim.md

  - id: RISK-SEC-001
    statement: >
      The frontend's role check is cosmetic. `auth.role` in the Vue store is read from
      localStorage, so a viewer can make the admin UI render for themselves. Every /admin
      route is guarded server-side, so the result is a screen full of 403s rather than
      access — a display bug, not a privilege escalation. Making it honest means deriving
      the role from a server response on every mount rather than from client storage.
    owner: maintainer
    re_open_trigger: "any admin-only behaviour is implemented in the frontend without a server-side guard behind it"
    decision_record: docs/security.md

  - id: RISK-SEC-002
    statement: >
      The users.role column is TEXT DEFAULT 'user' with no database-level constraint, so a
      value written outside the application — by hand on the host, or by a future migration
      — is not rejected. Every in-application writer validates against VALID_ROLES, and an
      unrecognised value is not equal to 'admin', so the failure is closed rather than open.
      A CHECK constraint cannot be added by ALTER TABLE at all; it needs the table copied,
      which is a different shape of migration from the additive loop init_db runs. Half of
      this risk's re-open trigger fired on 2026-08-28: WAIVER-OPS-001 is resolved and a failed
      migration now reports itself (docs/adr/0025-narrowing-the-migration-except.md), so a
      half-applied rebuild would at least be loud. It would still be half-applied, and the
      rebuild has no home until there is a migrations/ directory with a version table.
    owner: maintainer
    re_open_trigger: "a migrations/ directory with a version table exists, or a third role is introduced"
    decision_record: docs/security.md

  - id: RISK-TEST-001
    statement: >
      The container test tier cannot run on arm64: archlinux publishes no arm64 image and
      pacman fails under amd64 emulation. An Apple Silicon developer never exercises the
      real Taskwarrior binary locally and sees that tier only in CI.
    owner: maintainer
    re_open_trigger: "a second developer joins on arm64, or CI stops running x86_64"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-002
    statement: >
      RULE-TEST-002 has no automated negative fixture. The offline fixture sandbox has
      neither Docker nor an x86_64 host, so the container tier cannot be made to fail
      there on demand.
    owner: maintainer
    re_open_trigger: "Step 9's ledger validator requires an automated fixture for every executable rule"
    decision_record: docs/adr/0006-two-tier-backend-tests.md

  - id: RISK-TEST-003
    statement: >
      The suite runs bcrypt at its minimum cost factor so the gate stays inside its
      runtime budget. The production cost factor is therefore covered by no test.
    owner: maintainer
    re_open_trigger: "the password hashing scheme or its parameters change"
    decision_record: backend/tests/conftest.py

  - id: RISK-GOV-001
    statement: >
      Required-reviewer enforcement is impossible with a single maintainer: the only
      person who can approve a change is the person who wrote it. No control in this
      repository provides independent review of a change to the rules themselves.
    owner: maintainer
    re_open_trigger: "a second contributor gains write access to the repository"
    decision_record: docs/plan/phase-0-2.md F4

  - id: RISK-GOV-002
    statement: >
      tools/checks/branch-protection.sh needs network and an authenticated gh. Where it
      cannot reach GitHub it reports that and does not fail, so a run on an offline
      machine proves nothing about the live governance state.
    owner: maintainer
    re_open_trigger: "the scheduled decay review (Step 16c) begins carrying this evidence"
    decision_record: docs/adr/0005-gate-the-deploy.md

  - id: RISK-GOV-003
    statement: >
      RULE-GOV-001 has no automated negative fixture. Its violations were constructed and
      observed by hand against the live API because the offline fixture sandbox has no
      GitHub to drift from.
    owner: maintainer
    re_open_trigger: "Step 9's ledger validator requires an automated fixture for every executable rule"
    decision_record: docs/operations.md

  - id: RISK-BOOTSTRAP-001
    statement: >
      The non-uv bootstrap path (python3 -m venv against a system interpreter) is not
      exercised by CI; only `make doctor`'s warning covers it.
    owner: maintainer
    re_open_trigger: "a contributor reports a bootstrap failure, or a second CI runner image is added"
    decision_record: docs/adr/0002-python-interpreter-provisioning.md

  - id: RISK-MCP-001
    statement: >
      The index derives its mcp_tool nodes from route declarations, while the surface
      snapshot derives them by booting the app. Two producers of the same fact, and only one
      of them is observed. They agreed on the count when BLIND-MCP-001 was resolved, but
      nothing compares them, and the names differ in form — the index records the handler
      function name, the snapshot records the operation id. A query answered from the index
      will therefore give a tool name no client would recognise. Making the extractor read
      the snapshot would close it.
    owner: maintainer
    re_open_trigger: "an index query returns an mcp_tool name that does not appear in ops/surfaces/mcp-tools.json, or the extractor is changed to read the snapshot"
    decision_record: docs/adr/0020-runtime-observed-surfaces.md

  - id: RISK-OPS-006
    statement: >
      NOTHING PRUNES THE AUDIT DATABASE. `data/audit.db` grows for the lifetime of the
      deployment and no retention period, no vacuum and no archival step exists — that is a
      deliberate omission, not an oversight: a first cut that deletes rows is a first cut
      that can delete the evidence `SHIM-SEC-006` is waiting on, and choosing what may be
      forgotten is a decision with a legal and an operational half that has not been taken.
      The growth is dominated by one row per SUCCESSFULLY authenticated request, roughly
      150 bytes each, so a deployment serving ten thousand requests a day accumulates on the
      order of half a gigabyte a year on the same partition that holds `users.db` and the
      Taskwarrior data — the same partition whose exhaustion the container log rotation added
      in Step 15a was written to prevent, now with a second unbounded writer on it that
      Docker's log driver does not bound. There is a second, smaller
      amplification: a login failure writes a row and the rate limiter is per-username, so a
      caller cycling usernames can append faster than a legitimate one. Rejected credentials
      deliberately write nothing at all, which is what keeps that bounded by the login route
      rather than open to any unauthenticated request. Nothing measures the file, nothing
      alerts on it, and the disk it shares is the one that takes the database down with it.
    owner: maintainer
    re_open_trigger: "audit.db exceeds 100 MB, a retention period is agreed, disk pressure is observed on the deploy host, or the SHIM-SEC-006 soak completes and the evidence is no longer needed live"
    decision_record: docs/adr/0026-the-audit-log.md

  - id: RISK-OPS-001
    statement: >
      `platforms: linux/amd64` in deploy.yml is a declaration, not an enforced invariant.
      Nothing in the gate inspects the architecture of a pushed image, so an edit that
      removes the pin would publish an image matching whatever runner built it, and the
      failure would surface only as `exec format error` on the production host after the
      deploy had already replaced the running container.
    owner: maintainer
    re_open_trigger: "a second deployment target on a different architecture, or a build that runs anywhere other than a hosted x86_64 runner"
    decision_record: docs/adr/0015-pin-the-build-platform.md

  - id: RISK-DOC-003
    statement: >
      docs/threat-model.md is an assertion, not a derived artefact. Every claim in it was
      read out of the code by hand on 2026-08-28 and cited to a file and a line, and nothing
      re-derives any of it: line numbers move on the next edit, a new router or a new
      credential shape appears in no section until somebody adds it, and the gate stays green
      throughout. That is the same class of decay RULE-DOC-001 exists to prevent in AGENTS.md
      and RULE-DOC-004 in the records — and neither reaches this file, because the contract
      check reads AGENTS.md and the reference resolver reads docs/adr/ and docs/briefs/ only.
      Making it executable is not obviously possible: most of what a threat model asserts is
      an absence ("no egress", "no second auth path", "no credential in a row"), and an
      absence has no syntax to scan for. What IS mechanically held is held by the rules the
      document names section by section, which is why it names them rather than restating
      them; the residue is this risk. The mitigation is a convention: the document states,
      per section, which claims are enforced and which are only asserted, so a reader can
      see what the gate is not doing for them.
    owner: maintainer
    re_open_trigger: "a claim in docs/threat-model.md is found to be false, a new trust boundary or credential shape is added without a section describing it, or a decay review (Step 16c) is asked to carry this document"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-OPS-007
    statement: >
      The application makes NO network egress, and nothing keeps it that way. Verified
      2026-08-28: no import of httpx, requests, urllib, aiohttp, http.client, socket or
      smtplib appears anywhere under backend/app/, so the only outward call the serving
      process makes is the Taskwarrior subprocess. That absence is what the egress half of
      the threat model rests on, and it is an observation about today's tree rather than an
      invariant. Nothing forbids the first egress call and nothing announces it: httpx is
      already installed as a transitive dependency of mcp, so adding one is an import away.
      RULE-OPS-001 is the closest control and it is deliberately narrower — it requires a
      timeout on an egress call once one exists, which makes the first one survivable, not
      visible. RULE-ARCH-004 restricts subprocess to task_runner and could be extended to
      the HTTP clients, but that would forbid egress outright rather than route it through a
      declared boundary, and no such boundary has been designed. So the honest statement is:
      an agent adding an outbound call would satisfy every rule in the gate, and the threat
      model's egress section would silently become wrong.
    owner: maintainer
    re_open_trigger: "any module under backend/app/ imports an HTTP or socket client, an outbound integration is designed, or restricted_imports in architecture.toml is extended to cover egress"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-SEC-004
    statement: >
      No request field declares a length limit. backend/app/models.py constrains types and
      nothing else — no Field(max_length=...), no constr, no annotated bound on any of the
      string fields, and TaskCreate.description, AnnotationCreate.text and InboxItem.note
      are the ones that matter, because they travel into the Taskwarrior argv and into that
      user's task store. Neither uvicorn nor Starlette imposes a body-size limit by default,
      so the bound on a single task description is whatever Traefik and the kernel happen to
      allow. Two consequences, and their severity is deliberately not overstated: a very
      large description is storage growth in a per-user data directory on the same partition
      as users.db and audit.db (the partition RISK-OPS-006 is already about), and an
      argument long enough to exceed the kernel's per-argument limit makes execve fail,
      which task_runner surfaces as a 500 rather than a 400. The second was NOT reproduced
      here: the limit is a Linux constant and this repository's development host is macOS,
      where a one-megabyte argument executed fine. Both are capacity questions, which
      decision F1 puts out of scope — recorded rather than silently assumed, which is what
      F1 asks for.
    owner: maintainer
    re_open_trigger: "a 500 is observed from a long description or annotation, disk usage grows from task data rather than from logs or audit rows, a body-size limit is set at the proxy, or F1's capacity exclusion is revisited"
    decision_record: docs/adr/0027-the-threat-model.md

  - id: RISK-SEC-005
    statement: >
      RULE-SEC-001 reads backend/app/routers/*.py and nothing else — tools/checks/route_guards.py
      globs that one directory — so a route declared anywhere outside the routers package is
      neither observed nor required to appear in rules/route-guards.toml. One route is outside
      it today: GET /health, declared on the app object in backend/app/main.py, unauthenticated,
      returning a fixed {"status": "ok"}. That route is harmless and it is also the proof of the
      gap: the declaration file has thirty-one entries and the application serves thirty-two
      routes, and nothing anywhere says so. The consequence is not the health check, it is the
      next route someone adds beside it — a guard forgotten there fails exactly the way
      RULE-SEC-001 was written to prevent, silently and for everybody, while the gate stays
      green. The partial backstop is RULE-SURF-001: a new route changes the OpenAPI snapshot,
      so it cannot arrive unnoticed, but regenerating that snapshot is a normal part of adding
      a route and it demands no guard declaration. Closing this means widening the checker's
      scope to every module that can hold a decorator, which also means deciding what an
      infrastructure route like /health declares.
    owner: maintainer
    re_open_trigger: "a second route is declared outside backend/app/routers/, an authenticated or state-changing route is added to main.py, or the route-guard checker is given a wider scope"
    decision_record: docs/adr/0027-the-threat-model.md
