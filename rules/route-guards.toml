# Which guard every HTTP route requires. Normative: RULE-SEC-001 fails the gate when the
# code and this file disagree, in either direction.
#
#   admin   Depends(get_current_admin) — an authenticated user whose role is "admin"
#   user    Depends(get_current_user)  — any authenticated principal
#   open    reachable unauthenticated, or authenticating by some other means
#
# `open` requires a `reason`. A route anyone can reach is a decision, and a decision with
# no recorded reason cannot be told apart from an oversight.
#
# Adding a route means adding a line here. That is the point: the authorization posture of
# this surface is checked-in state, not an emergent property of thirty function signatures.
#
# The inventory is every route the booted application serves (brief 0073, ADR 0047): a route on
# the app object, a transport route and the framework's own routes are routes too, and a `Mount`
# is declared as `MOUNT <path>`.

version = 1


[[routes]]
route = "GET /admin/settings"
guard = "admin"

[[routes]]
route = "PUT /admin/settings"
guard = "admin"

[[routes]]
route = "GET /admin/users"
guard = "admin"

[[routes]]
route = "PUT /admin/users/{target}/role"
guard = "admin"

[[routes]]
route = "GET /auth/apikey"
guard = "user"

[[routes]]
route = "POST /auth/apikey/regenerate"
guard = "user"

# Brief 0070: hashed API keys. `user` is the guard; creating, revoking and the deprecated regenerate
# above additionally refuse an API key as the credential inside the handler (403) — only a
# signed-in session may mint or end one. The deprecated `GET /auth/apikey` above returns the legacy
# key only to a signed-in session or to the legacy key itself; any other key gets "" (review round 2).
[[routes]]
route = "POST /auth/apikeys"
guard = "user"

[[routes]]
route = "GET /auth/apikeys"
guard = "user"

[[routes]]
route = "DELETE /auth/apikeys/{key_id}"
guard = "user"

[[routes]]
route = "POST /auth/login"
guard = "open"
reason = """
The route that issues credentials cannot require them.
"""

[[routes]]
route = "GET /auth/me"
guard = "user"

[[routes]]
route = "PUT /auth/me"
guard = "user"

[[routes]]
route = "PUT /auth/password"
guard = "user"

[[routes]]
route = "GET /auth/registration-status"
guard = "open"
reason = """
The login page is shown to people who are not logged in, so the one endpoint that tells it
whether to offer registration cannot require an account. Discloses nothing that POSTing to
/auth/register does not already reveal.
"""

[[routes]]
route = "POST /auth/register"
guard = "open"
reason = """
Registration cannot require an account. Gated at runtime by the allow_registration site setting, which an admin controls through PUT /admin/settings.
"""

[[routes]]
route = "GET /gtd/inbox"
guard = "user"

[[routes]]
route = "GET /gtd/next"
guard = "user"

[[routes]]
route = "GET /gtd/projects"
guard = "user"

[[routes]]
route = "GET /gtd/projects/overview"
guard = "user"

[[routes]]
route = "GET /gtd/projects/{name}"
guard = "user"

[[routes]]
route = "GET /gtd/review"
guard = "user"

[[routes]]
route = "POST /gtd/review"
guard = "user"

[[routes]]
route = "GET /gtd/someday"
guard = "user"

[[routes]]
route = "GET /gtd/summary"
guard = "user"

[[routes]]
route = "GET /gtd/tickler"
guard = "user"

[[routes]]
route = "GET /gtd/waiting"
guard = "user"

[[routes]]
route = "POST /inbox"
guard = "user"

[[routes]]
route = "POST /projects"
guard = "user"

[[routes]]
route = "GET /projects/plans/{name}"
guard = "user"

[[routes]]
route = "PUT /projects/plans/{name}"
guard = "user"

[[routes]]
route = "PUT /projects/{name}/status"
guard = "user"

[[routes]]
route = "GET /skill"
guard = "open"
reason = """
The skill this server ships is public: a public repository's text, its content hash, and the
commit sha of a public build. The route exists to be read without a credential — the settings
page links it from a browser, the post-deploy job checks it before anyone holds a key for the
new build, and an operator debugging a version mismatch should not need one either. It
discloses nothing about a user, and nothing about the deployment that the image tags in a
public registry do not already say.
"""

[[routes]]
route = "GET /skill/runway.zip"
guard = "open"
reason = """
Same content, as a download. A plain `<a download>` cannot send a header, so requiring one
would mean the settings page could not offer the file it points at. The bytes are the same
for every caller and are built from a fixed file list with no parameter in the path, so there
is nothing here to vary by principal and nothing to traverse.
"""

[[routes]]
route = "GET /tasks"
guard = "user"

[[routes]]
route = "POST /tasks"
guard = "user"

[[routes]]
route = "DELETE /tasks/{uuid}"
guard = "user"

[[routes]]
route = "GET /tasks/{uuid}"
guard = "user"

[[routes]]
route = "PUT /tasks/{uuid}"
guard = "user"

[[routes]]
route = "POST /tasks/{uuid}/annotate"
guard = "user"

[[routes]]
route = "POST /tasks/{uuid}/done"
guard = "user"

[[routes]]
route = "POST /tasks/{uuid}/start"
guard = "user"

[[routes]]
route = "POST /tasks/{uuid}/stop"
guard = "user"

# --- routes outside backend/app/routers/ (brief 0073, RISK-SEC-005) ---------------------------
# Served all along and declared nowhere, because the checker used to read one directory.

[[routes]]
route = "GET /health"
guard = "open"
reason = """
The container healthcheck, the post-deploy check and an MCP client probing the server call it
before holding any credential. It returns a fixed {"status": "ok"} and reads nothing.
"""

[[routes]]
route = "POST /mcp"
guard = "open"
reason = """
The MCP transport (Streamable HTTP, stateless, ADR 0045). The endpoint itself takes no credential:
every tool call becomes a request to its own route, which enforces that route's guard with the
forwarded X-Api-Key/Authorization header, and only that route (mcp_gate.bind_mcp_target). The
in-flight budget and deadline bound what an anonymous caller can hold; initialize and tools/list
describe the public surface only.
"""

[[routes]]
route = "GET /mcp"
guard = "open"
reason = """
The same transport endpoint; in stateless mode a GET opens no stream and holds nothing (ADR 0045).
"""

[[routes]]
route = "DELETE /mcp"
guard = "open"
reason = """
The same transport endpoint; there is no session to delete in stateless mode (ADR 0045).
"""

[[routes]]
route = "GET /openapi.json"
guard = "open"
reason = """
FastAPI's served schema of this public API. The repository is public and README documents the
surface for third parties; ops/surfaces/openapi.json is the same document, checked in.
"""

[[routes]]
route = "GET /docs"
guard = "open"
reason = """
FastAPI's interactive documentation of the same public schema. It calls nothing by itself; a
request made from it carries the caller's own credential like any other client.
"""

[[routes]]
route = "GET /docs/oauth2-redirect"
guard = "open"
reason = """
A static helper page of the interactive documentation; it holds and returns no data.
"""

[[routes]]
route = "GET /redoc"
guard = "open"
reason = """
The alternative rendering of the same public schema.
"""
