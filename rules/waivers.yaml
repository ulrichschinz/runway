# Waiver register — every deliberate, temporary exception to a rule, with its expiry.
#
# A waiver is not "we decided this is fine". It is "this is not fine, here is who owns
# it, here is what protects us meanwhile, and here is the date it stops being allowed".
# An invalid or expired waiver fails the gate (validator lands in Step 9).
#
# Each entry records five groups:
#   1. rule and scope
#   2. reason and evaluated alternatives
#   3. risk and temporary mitigation
#   4. owner and approver
#   5. expiration, re-open trigger, and resolution path
#
# NOTE ON CLASS. `scheduled_remediation` entries below suppress a *linter finding* on
# pre-existing code whose fix is already planned and approved — not a security rule.
# No security gate rule exists yet for these findings; Steps 11 and 12 create both the
# fix and the rule that keeps it fixed. Calling them waivers would overstate the
# permission granted: nothing here authorises leaving the defect in place, only landing
# the lint gate before the fix.

version: 1

waivers:
  - id: WAIVER-TYPE-001
    class: scheduled_remediation
    rule: "mypy index — Value of type 'Row | None' is not indexable"
    scope: "backend/app/routers/auth.py (GET /auth/me), backend/app/routers/admin.py (PUT /admin/users/{target}/role)"
    finding: "NEW — not present in the Phase 0 baseline; found by mypy in Step 2"
    reason: >
      Both handlers index the result of aiosqlite fetchone() without checking for None.
      In GET /auth/me this is reachable: a user authenticated by a still-valid JWT whose
      row has since been deleted produces a TypeError and a 500. In the admin handler the
      row was checked and updated on the same connection, so None is not reachable in
      practice, but the types do not prove it.
    alternatives_evaluated: >
      Fixing it here was rejected: the correct behaviour for "authenticated user no
      longer exists" is a status-code decision on a hard-promise public surface (401 vs
      404 vs 500), and F2 requires surface changes to go through the migration pattern.
      Relaxing the mypy configuration was rejected because it would hide the whole class
      of finding, which is the one thing the type checker was added to catch.
    risk: >
      Low. A 500 instead of a clean 401 on a rare race. No data loss, no authorisation
      bypass — the request is already authenticated when it fails.
    mitigation: >
      None needed at this severity. `warn_unused_ignores` is enabled, so the suppressions
      self-report as stale the moment the code is fixed.
    owner: maintainer
    approver: maintainer
    approved_on: 2026-08-04
    approval_reference: "discovered during Step 2; recorded rather than fixed silently"
    expires: 2026-11-04
    re_open_trigger: >
      Step 3 characterization tests reach these handlers, or a 500 is observed in
      production on /auth/me, or the expiry date passes
    resolution: >
      Decide the status code for the missing-user state, apply it under the
      Public-Surface Migration pattern with a regression test, and delete the ignores.

# Resolved waivers. Kept rather than deleted: briefs and decision records cite these ids,
# and RULE-DOC-004 resolves every identifier a record names. Deleting the entry would make
# a truthful historical document fail the gate, and editing the document to match would
# falsify the history it exists to preserve.
resolved:
  - id: WAIVER-OPS-001
    finding: SEC-10
    was: >
      The schema migration loop in init_db wrapped four additive ALTER TABLE statements in
      `except Exception: pass`. That is how "column already exists" was tolerated on re-run,
      and it is also how a genuine migration failure became indistinguishable from a
      successful one: the database was left in an unknown state, later code read columns that
      may not exist, and nothing anywhere said so. The fix was blocked on there being
      somewhere to report the failures it would stop swallowing; this repository had no
      logging at all until Step 15a.
    resolved_on: 2026-08-28
    resolved_by: >
      Step 15b. The clause now catches sqlite3.Error, and only a
      `sqlite3.OperationalError` whose message contains "duplicate column name" passes
      silently — the exact type and wording observed against aiosqlite 0.20.0 on SQLite
      3.53.4, and pinned by a test rather than assumed. Every other database error is logged
      at ERROR on the JSON stream Step 15a built, naming the statement and SQLite's own words
      for what was wrong, and the loop continues: migrations are additive and init_db runs on
      every start, so a transient failure retries, and refusing to serve would convert a
      retryable error into a deploy-time outage (decision 3). The `# noqa: S110` is gone and
      ruff passes without it.
    evidence: docs/briefs/0019-narrowing-the-migration-except.md

  - id: WAIVER-SEC-002
    finding: SEC-3
    was: >
      User-supplied task descriptions and annotation text reached the `task` argv
      unvalidated. Taskwarrior consumes `rc.<key>=<value>` anywhere in its argument list as
      a runtime configuration override, including rc.data.location, which chooses which data
      store it opens — the only per-user isolation boundary the system has. Confirmed
      against the real binary on 2026-08-05: the override IS honoured. What stopped it being
      exploitable was an accident of Taskwarrior's own argument grammar, not a control.
    resolved_on: 2026-08-25
    resolved_by: >
      Step 12. Free text now travels after `--`, where Taskwarrior stops interpreting
      options, so an override in a description is inert by the binary's own grammar rather
      than by our filtering. task_runner.reject_structural_tokens refuses rc.-shaped tokens
      in the positions that must stay parseable, and RULE-ARCH-004 keeps subprocess reachable
      only from task_runner so the choke point stays the only door. Re-confirmed against
      Taskwarrior 3.5.0 in the container tier.
    evidence: docs/briefs/0014-taskwarrior-boundary.md

  - id: WAIVER-SEC-001
    finding: SEC-1
    was: >
      config.py shipped a working default JWT signing key in a public repository, so any
      deployment that forgot .env booted with a publicly known key and anyone could forge a
      token for any user.
    resolved_on: 2026-08-25
    resolved_by: >
      Step 11. backend/app/startup_checks.py refuses to start on any published default, on
      an empty secret, or on one shorter than 32 characters. The literal default remains in
      config.py so `import app.main` still succeeds with no environment, and is now inert:
      it cannot reach a serving process. Recorded as a justified suppression below.
    evidence: docs/briefs/0013-security-wave-2.md

# Permanently justified suppressions. These are NOT waivers: the finding is a false
# positive and there is nothing to remediate. They are recorded here so the reasoning is
# reviewable rather than buried in a bare `# noqa`.
justified_suppressions:
  - rule: "ruff S603 — subprocess call with untrusted input"
    scope: backend/app/services/task_runner.py
    reason: >
      The argv is a list, so shell=False applies and no shell metacharacter can start a
      process. What S603 cannot see is the real question — whether the callee interprets its
      own arguments — and that is now answered structurally: free text is passed after `--`,
      and reject_structural_tokens refuses configuration overrides in every other position.
      RULE-ARCH-004 keeps this the only module that may import subprocess. Was
      WAIVER-SEC-002, a scheduled remediation, until Step 12.
    reviewed_by: maintainer
    reviewed_on: 2026-08-25

  - rule: "ruff S105 — hardcoded password assigned to jwt_secret"
    scope: >
      backend/app/config.py, tools/surfaces.py
    reason: >
      In tools/surfaces.py the assignment is a throwaway value that lets startup_checks
      allow the capture to boot; capturing a public surface must not depend on an operator's
      environment. In config.py the default is kept so that `import app.main` succeeds with
      no environment — the
      import check (RULE-DEP-001), the unit tier and any tooling that reads the app object
      would otherwise all need a secret provisioned first. It is inert: startup_checks
      rejects this exact string, so no serving process can ever hold it. Was
      WAIVER-SEC-001, a scheduled remediation, until Step 11 made it fatal at boot.
    reviewed_by: maintainer
    reviewed_on: 2026-08-25

  - rule: "ruff S105 — hardcoded password assigned to PASSWORD_CHANGED"
    scope: backend/app/audit.py
    reason: >
      `PASSWORD_CHANGED = "auth.password.changed"` is the name of an audit event, not a
      credential: the value is a vocabulary term that appears in the `event` column of every
      row recording a password change, and it is the string an operator types into a query.
      S105 matches on the identifier containing "password", which here describes the subject
      of the event rather than its content. The alternatives were both worse — abbreviating
      the constant would make the vocabulary less readable than the thing it names, and
      assembling the literal at runtime to dodge the scan would hide it from `grep`, which is
      how these names are actually found. Exactly the same reading as the `token_type` entry
      below.
    reviewed_by: maintainer
    reviewed_on: 2026-08-28

  - rule: "ruff S105 — hardcoded password assigned to token_type"
    scope: backend/app/models.py
    reason: >
      `token_type: str = "bearer"` is the OAuth 2.0 token type name required by the
      response schema, not a credential. Renaming the field to satisfy the linter would
      break the documented API surface.
    reviewed_by: maintainer
    reviewed_on: 2026-08-04

  - rule: "ruff S608 — possible SQL injection through string-based query construction"
    scope: backend/app/routers/auth.py
    reason: >
      The only interpolated fragments are literals chosen from a fixed set inside the
      function ("full_name=?", "email=?"). No user input reaches the SQL string; every
      value is passed as a bound parameter. Verified by reading the construction site.
    reviewed_by: maintainer
    reviewed_on: 2026-08-04

  - rule: "ruff S404 — import of the subprocess module"
    scope: >
      tools/checks/log_secrets.py, tools/checks/pinning.py, tools/checks/secret_scan.py,
      tools/checks/timeouts.py, tools/index/boundaries.py
    reason: >
      These are repository tooling, not the application. Each imports subprocess for exactly
      one thing — running `git ls-files` to get the tracked-file list — with a literal argv and
      no user input anywhere near it. RULE-ARCH-004 restricts subprocess inside backend/app/,
      which is the boundary that matters; extending it to the toolchain would mean five
      standing exceptions, and a rule with five standing exceptions teaches people it is noise.
    reviewed_by: maintainer
    reviewed_on: 2026-08-28

  - rule: "ruff E402 — module level import not at top of file"
    scope: >
      tools/index/build.py, tools/index/cli.py, tools/index/mcp_server.py,
      tools/index/boundaries.py, tools/brief.py
    reason: >
      The index modules run as scripts and import their siblings by bare name, which
      requires inserting their own directory on sys.path before those imports. The
      alternative is turning tools/index into an installable package, which would add
      packaging machinery to a component whose whole design point (ADR 0008) is having no
      dependencies and no build step. tools/brief.py is a consumer of that same layer and
      imports it the same way, for the same reason; scope extended 2026-08-23.
    reviewed_by: maintainer
    reviewed_on: 2026-08-23
