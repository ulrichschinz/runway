server {
    listen 4000;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Browser security headers (finding SEC-004, ADR 0048). RULE-OPS-005 holds every line below.
    #
    # At server level and with `always`, so they go out on every response this server sends —
    # the SPA, its assets, the index.html fallback, the proxied API, and the 4xx/5xx nginx
    # generates itself. Without `always` nginx adds a header to 2xx/3xx only. And NO location
    # below may declare an add_header of its own: nginx inherits add_header only into a block
    # that declares none, so one would silently strip all of these from that location.
    #
    # The enforced policy is the part that cannot break the SPA: nothing may frame it, no plugin
    # content, no <base> rewriting relative URLs, forms post only here.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;

    # The strict policy, report-only until SHIM-WEB-001's soak ends: same origin for everything,
    # no inline script or style, no eval. data: images only. connect-src 'self' covers /api and
    # /api/mcp. No report-uri — no foreign endpoint, and none of our own exists, so violations
    # show in the browser console (docs/security.md#browser-headers).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Every powerful feature denied but clipboard writing, which Settings uses to copy the API
    # key and the MCP snippets — and only for this origin.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), clipboard-read=(), clipboard-write=(self)" always;

    # No Strict-Transport-Security here. This server speaks plain HTTP behind the TLS terminator;
    # HSTS belongs there, and only after every affected host is confirmed permanently HTTPS
    # (docs/operations.md#container-hardening).

    # The auth routes carry a username and at most two 1024-byte passwords: 16 KiB is generous,
    # and a login cannot make the backend read a large body (SEC-006, brief 0067). The backend
    # enforces the same limit itself, for a caller that reaches it without this proxy. Every
    # other /api/ path keeps nginx's default client_max_body_size of 1m, which the backend
    # mirrors.
    # X-Forwarded-For is appended to, never passed through: the backend's login limiter reads it
    # from the right, and the right-most entry must be the address that connected to nginx, not
    # one a client wrote (brief 0069). Which of those hops the backend believes is TRUSTED_PROXIES.
    location /api/auth/ {
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The headers above are this edge's to set. Hiding any the backend might send keeps the
        # response to one copy of each, not two that disagree.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
