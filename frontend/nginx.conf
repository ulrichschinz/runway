server {
    listen 4000;
    root /usr/share/nginx/html;
    index index.html;

    # The auth routes carry a username and at most two 1024-byte passwords: 16 KiB is generous,
    # and a login cannot make the backend read a large body (SEC-006, brief 0067). The backend
    # enforces the same limit itself, for a caller that reaches it without this proxy. Every
    # other /api/ path keeps nginx's default client_max_body_size of 1m, which the backend
    # mirrors.
    location /api/auth/ {
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
