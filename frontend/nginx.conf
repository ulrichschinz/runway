server {
    listen 4000;
    root /usr/share/nginx/html;
    index index.html;

    # The auth routes carry a username and at most two 1024-byte passwords: 16 KiB is generous,
    # and a login cannot make the backend read a large body (SEC-006, brief 0067). The backend
    # enforces the same limit itself, for a caller that reaches it without this proxy. Every
    # other /api/ path keeps nginx's default client_max_body_size of 1m, which the backend
    # mirrors.
    # X-Forwarded-For is appended to, never passed through: the backend's login limiter reads it
    # from the right, and the right-most entry must be the address that connected to nginx, not
    # one a client wrote (brief 0069). Which of those hops the backend believes is TRUSTED_PROXIES.
    location /api/auth/ {
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
