# The main nginx configuration of the frontend image (ADR 0048).
#
# The base image's own nginx.conf, changed in exactly three ways so the server runs as an
# unprivileged user on a read-only root filesystem:
#
#   - no `user` directive: it only applies to a master started as root, and warns otherwise;
#   - the pid file and all five temp paths live under /tmp/nginx, the one writable place;
#   - the server block is included from /tmp/nginx/conf.d, where the container's command writes
#     it after substituting BACKEND_HOST into frontend/nginx.conf.
#
# The image's /etc/nginx/conf.d/default.conf (a server on port 80) is no longer included. A
# non-root nginx could not bind port 80, and this application has never served it.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    include /tmp/nginx/conf.d/*.conf;
}
