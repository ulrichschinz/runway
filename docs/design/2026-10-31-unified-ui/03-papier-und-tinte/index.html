<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>runway · Papier &amp; Tinte</title>
<meta name="description" content="runway web, Vorschlag 03 Papier und Tinte: Typografie zuerst, Tinte nur für Erledigt und die leere Inbox.">
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1428" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../shared/brand/fonts/fonts.css">
<link rel="stylesheet" href="../shared/brand/tokens.css">
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="web.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<!-- ink edge: a whisper of displacement so lines read as pen on paper, not as CSS -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="ink-edge" x="-4%" y="-60%" width="108%" height="220%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Navigation"></aside>
  <div class="page">
    <header class="phonebar" id="phonebar"></header>
    <main class="scroll" id="scroll">
      <div class="col">
        <div class="topline" id="topline">
          <span id="back" style="margin-right:auto"></span>
          <label class="search"><span class="sr">Suchen</span><input id="search" type="search" placeholder="Suchen" autocomplete="off"><kbd>/</kbd></label>
          <span class="stand">Stand 09:41</span>
          <button class="pill quiet todaybtn" id="todaybtn" data-act="today" aria-pressed="false">Heute</button>
        </div>
        <div id="head" class="head"></div>
        <div id="body"></div>
      </div>
    </main>
    <form class="capture" id="capture" autocomplete="off">
      <span class="plus" aria-hidden="true">+</span>
      <input type="text" placeholder="Neues Todo" aria-label="Neues Todo" enterkeyhint="done">
      <span class="hint">⏎ in die Inbox</span><kbd>n</kbd>
    </form>
  </div>
  <aside class="margin" id="margin" aria-label="Randspalte"></aside>
</div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="sheet-scrim" id="keys"></div>
<script type="module" src="web.js"></script>
</body>
</html>
