# Which check runs in which verification profile.
#
#   check   fast local feedback; must stay inside its runtime budget (budgets.conf)
#   verify  the authoritative mergeability gate — a green run means "mergeable"
#
# CHECK never substitutes for VERIFY. A check that is slow, needs Docker, or needs the
# network belongs in verify only.
#
# name               profiles        purpose
repo-hygiene         check,verify    Secret-bearing paths stay untracked and git-ignored
task-interface       check,verify    The command surface and its documentation agree
toolchain-pinning    check,verify    Declared runtime versions match the Dockerfiles
py-import            check,verify    The backend imports cleanly (the service can start)
py-format            check,verify    Backend Python is formatted by ruff format
py-lint              check,verify    Backend Python passes ruff check
py-types             check,verify    Backend Python passes mypy
js-lint              check,verify    Frontend JavaScript and Vue pass eslint
py-test-unit         check,verify    Backend unit suite passes (Taskwarrior faked)
js-test              check,verify    Frontend logic suite passes
py-test-container    verify          Backend suite passes against the real Taskwarrior
index-fresh          check,verify    The index is current with the working tree
index-qualified      verify          The index passes its qualification suite
contract             check,verify    AGENTS.md holds, the ledger is complete, no expired waivers
route-guards         check,verify    Every HTTP route's guard matches rules/route-guards.toml
surfaces             check,verify    Public surfaces match their snapshots; env vars agree with README
supply-chain         check,verify    Licences classified, no committed secrets, images and deps pinned
boundaries           check,verify    Unit dependencies, cycles and hubs stay within contract
index-parity         verify          CLI and MCP adapters return the same facts
index-deterministic  verify          Rebuilding unchanged sources is byte-identical
branch-protection    verify          Live branch protection matches the checked-in state
json-output          verify          JSON mode emits valid JSON and nothing else
gate-conformance     verify          Every executable rule is proven able to fail
