# The declared structure of this repository.
#
# CANONICAL. The index reads this to answer "which unit owns X"; Step 8 adds the boundary
# checker that enforces the allowed edges below. This file is NORMATIVE — it states what
# is allowed. The index is DESCRIPTIVE — it reports what exists. An edge the index found
# never legitimises a dependency this file forbids.
#
# WHY TOML AND NOT YAML. The index parses this file, and Python parses TOML in the
# standard library (tomllib) while YAML needs a third-party dependency. ADR 0008 commits
# the index to zero dependencies, so the format follows. rules/ledger.yaml stays YAML for
# now: it is read by humans and by a shell helper, and Step 9 revisits its format when it
# gains a validator.
#
# Organizing axes (see docs/plan/phase-0-2.md section 1):
#   repository -> deployable unit          backend | frontend | ops
#   backend    -> layer, feature inside it routers -> services -> adapters -> leaves
#   frontend   -> feature / route          declared over the existing folders, no moves
#
# Frontend units are DECLARED, not foldered. MODE C forbids restructuring, and a path map
# gives the index and the boundary checker everything a folder move would, at no
# migration risk. Re-open trigger: a third feature unit, or components/ exceeding 15 files.

version = 1

# --- scopes -----------------------------------------------------------------

[[scopes]]
id = "repository"
axis = "deployable unit"
rationale = "Only 4 of 26 commits touched both backend/ and frontend/. Separate images, separate toolchains, separate release lifecycles."

[[scopes]]
id = "backend"
axis = "layer, with feature slices inside each layer"
rationale = "What the code already is, and it holds. A domain-package split is the recorded alternative; its trigger is >12 routers or >3,000 backend LOC."

[[scopes]]
id = "frontend"
axis = "feature / route plus a shared layer"
rationale = "Co-change clusters around the tasks feature (store + modal + view controller), not around file type."

# --- units ------------------------------------------------------------------

[[units]]
id = "ops"
scope = "repository"
owner = "maintainer"
paths = [
  "tools/**", "ops/**", ".github/**", "Makefile", "run", "docker-compose.yml",
  "rules/**", "architecture.toml", "index/**", ".gitignore", ".env.example",
  "backend/Dockerfile", "backend/Dockerfile.test", "backend/requirements.txt",
  "backend/requirements-dev.txt", "backend/requirements.lock",
  "backend/requirements-dev.lock", "policy/**", "backend/pyproject.toml", "backend/taskrc_template.txt",
  "backend/log_config.json",
  "frontend/Dockerfile", "frontend/nginx.conf", "frontend/package.json",
  "frontend/package-lock.json", "frontend/vite.config.js", "frontend/eslint.config.js",
  "frontend/postcss.config.js", "frontend/tailwind.config.js", "frontend/index.html",
  "frontend/public/**",
]

[[units]]
id = "docs"
scope = "repository"
owner = "maintainer"
paths = ["docs/**", "README.md", "LICENSE", "agent-ready.md", "AGENTS.md", "CLAUDE.md", "backend/AGENTS.md", "frontend/AGENTS.md"]

[[units]]
id = "tests"
scope = "repository"
owner = "maintainer"
paths = ["backend/tests/**", "frontend/tests/**"]

[[units]]
id = "be/app"
scope = "backend"
layer = 0
owner = "maintainer"
paths = ["backend/app/main.py", "backend/app/__init__.py"]
note = """
Application assembly. Imports routers and wires middleware; nothing imports it back.
"""

[[units]]
id = "be/di"
scope = "backend"
layer = 1
owner = "maintainer"
paths = ["backend/app/dependencies.py"]
note = """
Dependency providers that routers inject (get_current_user, get_current_admin). Split out
of the old be/entry: assembly and provision are opposite directions, and lumping them
together manufactured a be/entry <-> be/routers cycle that the code does not contain.
"""

[[units]]
id = "be/routers"
scope = "backend"
layer = 1
owner = "maintainer"
paths = ["backend/app/routers/**"]

[[units]]
id = "be/services"
scope = "backend"
layer = 2
owner = "maintainer"
paths = ["backend/app/services/task_service.py", "backend/app/services/user_service.py", "backend/app/services/__init__.py"]

[[units]]
id = "be/adapters/db"
scope = "backend"
layer = 3
owner = "maintainer"
paths = ["backend/app/database.py"]
note = """
Owns the database connection. get_db is a FastAPI dependency provider, so routers import
it directly for injection — that is the framework's idiom, not a layering breach, and the
allowed edges below permit it.
"""

[[units]]
id = "be/adapters/task"
scope = "backend"
layer = 3
owner = "maintainer"
paths = ["backend/app/services/task_runner.py"]
note = """
Owns the Taskwarrior subprocess. Routers MUST NOT import this: every task operation goes
through be/services, which is where validation lives. gtd.py currently breaches that and
the index reports it.
"""

[[units]]
id = "be/leaves"
scope = "backend"
layer = 4
owner = "maintainer"
paths = [
  "backend/app/models.py",
  "backend/app/config.py",
  "backend/app/auth.py",
  "backend/app/startup_checks.py",
  "backend/app/rate_limit.py",
  "backend/app/logging_setup.py",
  "backend/app/middleware.py",
]
note = """
Leaves depend on nothing above them, which is what lets anything reach them. logging_setup
is here for exactly that reason: a router, a dependency and the database adapter all need to
be able to log, and a logging module owned by any higher layer would make one of those an
upward edge. middleware.py sits beside it because the correlation id it assigns is only
useful through the ContextVar the formatter reads.
"""

[[units]]
id = "fe/app"
scope = "frontend"
owner = "maintainer"
paths = [
  "frontend/src/App.vue",
  "frontend/src/main.js",
  "frontend/src/router/**",
  "frontend/src/style.css",
]
note = """
Composition root: the router imports every view. Nothing imports it back.
"""

[[units]]
id = "fe/layout"
scope = "frontend"
owner = "maintainer"
paths = [
  "frontend/src/components/AppShell.vue",
  "frontend/src/components/NavItem.vue",
  "frontend/src/components/BrandMark.vue",
]
note = """
Chrome that feature views wrap themselves in. Split out of the old fe/shell: the router
imports views and views import the layout, so keeping both in one unit manufactured a
cycle for every feature rather than exposing the one real cycle (CYCLE-001).
"""

[[units]]
id = "fe/tasks"
scope = "frontend"
owner = "maintainer"
paths = [
  "frontend/src/components/TaskList.vue",
  "frontend/src/components/TaskRow.vue",
  "frontend/src/components/TaskModal.vue",
  "frontend/src/components/TaskActionSheet.vue",
  "frontend/src/components/UrgencyBadge.vue",
  "frontend/src/stores/tasks.js",
  "frontend/src/views/InboxView.vue",
  "frontend/src/views/NextView.vue",
  "frontend/src/views/WaitingView.vue",
  "frontend/src/views/SomedayView.vue",
  "frontend/src/views/AllTasksView.vue",
  "frontend/src/views/_useTaskView.js",
]

[[units]]
id = "fe/projects"
scope = "frontend"
owner = "maintainer"
paths = ["frontend/src/views/ProjectsView.vue", "frontend/src/components/ProjectPlanModal.vue"]

[[units]]
id = "fe/identity"
scope = "frontend"
owner = "maintainer"
paths = ["frontend/src/views/LoginView.vue", "frontend/src/views/SettingsView.vue", "frontend/src/stores/auth.js"]

[[units]]
id = "fe/shared"
scope = "frontend"
owner = "maintainer"
paths = ["frontend/src/api/**", "frontend/src/composables/**", "frontend/src/shared/**"]

# --- allowed dependency edges ------------------------------------------------
# Anything not listed is forbidden. Step 8 turns this into an enforced check; today the
# index reports violations descriptively.

# Sensitive standard-library modules, and the exhaustive list of files allowed to import
# them. Enforced by RULE-ARCH-004.
#
# A choke point only works while it stays the only door. Every control in task_runner —
# the `--` separator, the override refusal — is worth exactly nothing if a second module
# imports subprocess and calls `task` directly, and that is an easy change to make by
# accident while chasing something else.

[[restricted_imports]]
module = "subprocess"
# The application's runtime only. Repository tooling shells out to git constantly and
# legitimately; a rule that flagged that would be switched off within the week.
scope = "backend/app/"
allowed_in = ["backend/app/services/task_runner.py"]
reason = """
task_runner is the single place this application invokes the Taskwarrior binary, which is
what makes its argv hardening a control rather than a convention (finding SEC-3). A second
caller would bypass the separator and the override refusal without anything going red.
"""

[[allowed_edges]]
from = "be/app"
to = ["be/routers", "be/di", "be/services", "be/adapters/db", "be/adapters/task", "be/leaves"]

[[allowed_edges]]
from = "be/di"
to = ["be/adapters/db", "be/leaves"]

[[allowed_edges]]
from = "be/routers"
to = ["be/services", "be/leaves", "be/di", "be/adapters/db"]
note = """
be/di appears here because routers inject get_current_user; be/adapters/db because get_db
is a provider injected the same way. be/adapters/task is deliberately absent — a router reaching the Taskwarrior subprocess
directly skips the validation in be/services. gtd.py does exactly that today.
"""

[[allowed_edges]]
from = "be/services"
to = ["be/adapters/db", "be/adapters/task", "be/leaves"]

[[allowed_edges]]
from = "be/adapters/db"
to = ["be/leaves"]

[[allowed_edges]]
from = "be/adapters/task"
to = ["be/leaves"]

[[allowed_edges]]
from = "be/leaves"
to = []

[[allowed_edges]]
from = "fe/app"
to = ["fe/tasks", "fe/projects", "fe/identity", "fe/shared", "fe/layout"]
note = "Route composition: the router imports every view."

[[allowed_edges]]
from = "fe/layout"
to = ["fe/shared", "fe/identity", "fe/tasks"]
note = """
The sidebar reads the tasks store for context tags and the auth store for the current
user. The tasks edge is the remaining real cycle — CYCLE-001.
"""

[[allowed_edges]]
from = "fe/tasks"
to = ["fe/shared", "fe/layout"]

[[allowed_edges]]
from = "fe/projects"
to = ["fe/shared", "fe/layout", "fe/tasks"]
note = "ProjectsView reuses the task list components; recorded rather than forbidden."

[[allowed_edges]]
from = "fe/identity"
to = ["fe/shared", "fe/layout"]

[[allowed_edges]]
from = "fe/shared"
to = []

[[allowed_edges]]
from = "ops"
to = []

[[allowed_edges]]
from = "docs"
to = []

[[allowed_edges]]
from = "tests"
to = ["be/app", "be/di", "be/routers", "be/services", "be/adapters/db", "be/adapters/task", "be/leaves", "fe/shared", "fe/tasks"]
note = "Tests may reach anything they protect; that is what makes them tests."

# --- cycles that exist today -------------------------------------------------
# With an owner and a teardown path. This inventory may only shrink (Step 8 adds the ratchet).

[[known_cycles]]
id = "CYCLE-001"
between = ["fe/layout", "fe/tasks"]
evidence = "AppShell.vue (fe/layout) imports stores/tasks.js (fe/tasks) for the context-tag sidebar, while every task view (fe/tasks) imports AppShell.vue."
owner = "maintainer"
teardown = "Pass context tags into AppShell as props or via a slot, so the chrome stops importing the tasks store."
accepted_on = "2026-08-05"

[[known_cycles]]
id = "CYCLE-002"
between = ["fe/layout", "fe/identity"]
evidence = "AppShell.vue (fe/layout) imports stores/auth.js (fe/identity) to show the current user, while LoginView and SettingsView (fe/identity) import AppShell.vue."
owner = "maintainer"
teardown = """
The same fix as CYCLE-001: AppShell should receive what it displays rather than reach into
stores. Both cycles are one design decision — the chrome reads global state directly — and
one change removes both.
"""
accepted_on = "2026-08-05"
